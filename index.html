<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Kockázzunk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Josefin+Sans:wght@500;600;700&family=Marcellus&display=swap">
<style>
/* Elrendezés: fejléc + fő nézet (közép, max 1120px) + telefonon alsó fül-sáv. Hangulat: gyertyafényes esti asztal, krém fatábla, fa kockák. */
:root {
  --bg: #f8eee6; --bg2: #f1e2d7; --surface: #fffaf5; --surface2: #f6e9de; --raise: #ffffff;
  --line: rgba(90, 45, 40, .14); --line2: rgba(90, 45, 40, .28);
  --fg: #2a1a1d; --fg2: #66504f; --fg3: #8f7776;
  --heart: #d23f58; --on-accent: #ffffff;
  --board: #fffcf6; --board2: #f4e8d4; --boardink: #a67c40; --boardline: rgba(120, 80, 30, .24);
  --wood1: #efd5a9; --wood2: #d8ad72; --woodink: #4b2d15;
  --glow: rgba(255, 176, 96, .30);
  --bokeh1: rgba(255, 170, 120, .34); --bokeh2: rgba(236, 110, 140, .26); --bokeh3: rgba(255, 214, 140, .38);
  --shadow: 0 10px 30px rgba(90, 35, 35, .16); --shadow-s: 0 2px 8px rgba(90, 35, 35, .12);
  --ok: #2c8a58; --warn: #a96d14; --danger: #c52f48;
  --f-ui: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  --f-display: 'Marcellus', 'Palatino Linotype', 'Book Antiqua', Georgia, serif;
  --f-cube: 'Josefin Sans', 'Trebuchet MS', 'Gill Sans', sans-serif;
  --tc: var(--heart);
  --gut: max(16px, env(safe-area-inset-left, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #150e14; --bg2: #1d121b; --surface: #251925; --surface2: #2f202e; --raise: #38283a;
    --line: rgba(255, 225, 205, .11); --line2: rgba(255, 225, 205, .24);
    --fg: #f8ede5; --fg2: #cfbab3; --fg3: #927d7c;
    --heart: #ee647c;
    --board: #f4e9d6; --board2: #e6d4b4; --boardink: #9d7238; --boardline: rgba(110, 70, 20, .3);
    --glow: rgba(255, 170, 90, .26);
    --bokeh1: rgba(255, 150, 90, .20); --bokeh2: rgba(220, 70, 120, .22); --bokeh3: rgba(255, 200, 120, .16);
    --shadow: 0 14px 36px rgba(0, 0, 0, .5); --shadow-s: 0 2px 10px rgba(0, 0, 0, .4);
    --ok: #52c488; --warn: #e3a550; --danger: #ff6b82;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #150e14; --bg2: #1d121b; --surface: #251925; --surface2: #2f202e; --raise: #38283a;
  --line: rgba(255, 225, 205, .11); --line2: rgba(255, 225, 205, .24);
  --fg: #f8ede5; --fg2: #cfbab3; --fg3: #927d7c;
  --heart: #ee647c;
  --board: #f4e9d6; --board2: #e6d4b4; --boardink: #9d7238; --boardline: rgba(110, 70, 20, .3);
  --glow: rgba(255, 170, 90, .26);
  --bokeh1: rgba(255, 150, 90, .20); --bokeh2: rgba(220, 70, 120, .22); --bokeh3: rgba(255, 200, 120, .16);
  --shadow: 0 14px 36px rgba(0, 0, 0, .5); --shadow-s: 0 2px 10px rgba(0, 0, 0, .4);
  --ok: #52c488; --warn: #e3a550; --danger: #ff6b82;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
html.modal-open { overflow: hidden; }
body {
  background: var(--bg); color: var(--fg);
  font: 400 1rem/1.5 var(--f-ui);
  min-height: 100%; overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--bg); }
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 400; margin: 0; line-height: 1.2; text-wrap: balance; letter-spacing: .01em; }
p { margin: 0; }
button { font: inherit; color: inherit; }
a { color: var(--tc); }
:focus-visible { outline: 2px solid var(--tc); outline-offset: 2px; border-radius: 6px; }
.muted { color: var(--fg2); }
.small { font-size: .875rem; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { display: inline-flex; flex: none; line-height: 0; }

/* ---------- háttér: bokeh gyertyafény ---------- */
#bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
#bg i { position: absolute; border-radius: 50%; filter: blur(34px); animation: drift 22s ease-in-out infinite alternate; }
#bg i:nth-child(1) { width: 38vmax; height: 38vmax; left: -10vmax; top: -8vmax; background: radial-gradient(circle, var(--bokeh2), transparent 68%); }
#bg i:nth-child(2) { width: 30vmax; height: 30vmax; right: -8vmax; top: 6vmax; background: radial-gradient(circle, var(--bokeh1), transparent 68%); animation-duration: 28s; }
#bg i:nth-child(3) { width: 22vmax; height: 22vmax; left: 30%; bottom: -8vmax; background: radial-gradient(circle, var(--bokeh3), transparent 68%); animation-duration: 25s; }
#bg i:nth-child(4) { width: 7vmax; height: 7vmax; left: 12%; top: 38%; background: radial-gradient(circle, var(--bokeh3), transparent 70%); filter: blur(10px); animation-duration: 14s; }
#bg i:nth-child(5) { width: 5vmax; height: 5vmax; right: 18%; top: 54%; background: radial-gradient(circle, var(--bokeh1), transparent 70%); filter: blur(8px); animation-duration: 17s; }
#bg i:nth-child(6) { width: 9vmax; height: 9vmax; right: 34%; top: 12%; background: radial-gradient(circle, var(--bokeh3), transparent 70%); filter: blur(14px); animation-duration: 19s; }
#bg i:nth-child(7) { width: 6vmax; height: 6vmax; left: 52%; top: 66%; background: radial-gradient(circle, var(--bokeh2), transparent 70%); filter: blur(10px); animation-duration: 16s; }
@keyframes drift { from { transform: translate3d(0, 0, 0) scale(1); } to { transform: translate3d(3vmax, 2vmax, 0) scale(1.08); } }

#app { position: relative; z-index: 1; padding-left: var(--gut); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 28px; min-height: 100vh; }
#app > * { max-width: 1120px; margin-inline: auto; width: 100%; }

/* ---------- fejléc + navigáció ---------- */
#top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; display: flex; align-items: center; gap: 12px; padding-block: 10px; }
#top::before { content: ""; position: absolute; z-index: -1; top: 0; bottom: 0; left: calc(50% - 50vw); right: calc(50% - 50vw); background: color-mix(in srgb, var(--bg) 62%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid transparent; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--fg); border: 0; background: none; padding: 4px; cursor: pointer; border-radius: 12px; }
.brand-mark { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(145deg, var(--wood1), var(--wood2)); box-shadow: inset 0 0 0 1.5px rgba(255, 245, 220, .5), 0 3px 8px rgba(80, 40, 10, .3); display: grid; place-items: center; color: var(--heart); transform: rotate(-8deg); transition: transform .3s; }
.brand:hover .brand-mark { transform: rotate(6deg) scale(1.06); }
.brand-name { font-family: var(--f-display); font-size: 1.45rem; letter-spacing: .02em; }
.nav { display: flex; gap: 4px; margin-left: auto; }
.nav a { display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 999px; text-decoration: none; color: var(--fg2); font-weight: 600; font-size: .94rem; transition: background .2s, color .2s; }
.nav a:hover { background: var(--surface2); color: var(--fg); }
.nav a[aria-current="page"] { background: color-mix(in srgb, var(--tc) 16%, transparent); color: var(--fg); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--tc) 40%, transparent); }
.nav a[aria-current="page"] .ic { color: var(--tc); }
#top .tools { display: flex; gap: 4px; }
#tabs { display: none; }

@media (max-width: 800px) {
  .nav { display: none; }
  #top { justify-content: space-between; }
  #top .tools { margin-left: auto; }
  #tabs { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); background: color-mix(in srgb, var(--surface) 94%, transparent); border-top: 1px solid var(--line); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); max-width: none; justify-content: space-around; }
  #tabs a { display: flex; flex-direction: column; align-items: center; gap: 2px; flex: 1; padding: 6px 2px; border-radius: 12px; text-decoration: none; color: var(--fg2); font-size: .7rem; font-weight: 600; min-width: 0; }
  #tabs a[aria-current="page"] { color: var(--fg); background: color-mix(in srgb, var(--tc) 14%, transparent); }
  #tabs a[aria-current="page"] .ic { color: var(--tc); }
  #app { padding-bottom: 96px; }
}
@media (max-width: 420px) { .brand-name { font-size: 1.25rem; } }

/* ---------- gombok ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 9px 16px; border-radius: 12px; border: 1px solid var(--line2); background: var(--surface2); color: var(--fg); font-weight: 600; font-size: .94rem; cursor: pointer; transition: transform .15s, box-shadow .2s, background .2s, border-color .2s; text-decoration: none; }
.btn:hover { background: var(--raise); transform: translateY(-1px); box-shadow: var(--shadow-s); }
.btn:active { transform: translateY(0) scale(.98); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn.primary { background: linear-gradient(180deg, color-mix(in srgb, var(--tc) 88%, #fff), var(--tc)); border-color: color-mix(in srgb, var(--tc) 70%, #000); color: var(--on-accent); box-shadow: 0 4px 14px color-mix(in srgb, var(--tc) 40%, transparent), inset 0 1px 0 rgba(255, 255, 255, .3); text-shadow: 0 1px 1px rgba(0, 0, 0, .18); }
.btn.primary:hover { box-shadow: 0 6px 20px color-mix(in srgb, var(--tc) 50%, transparent), inset 0 1px 0 rgba(255, 255, 255, .3); background: linear-gradient(180deg, color-mix(in srgb, var(--tc) 80%, #fff), color-mix(in srgb, var(--tc) 92%, #000)); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--fg2); }
.btn.ghost:hover { background: var(--surface2); color: var(--fg); box-shadow: none; }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, transparent); background: transparent; }
.btn.danger:hover { background: color-mix(in srgb, var(--danger) 12%, transparent); }
.btn.danger.solid { background: var(--danger); color: #fff; border-color: transparent; }
.btn.sm { min-height: 34px; padding: 5px 11px; font-size: .85rem; border-radius: 10px; }
.btn.lg { min-height: 54px; padding: 12px 30px; font-size: 1.1rem; border-radius: 16px; }
.ibtn { display: inline-grid; place-items: center; width: 38px; height: 38px; flex: none; border-radius: 12px; border: 1px solid transparent; background: transparent; color: var(--fg2); cursor: pointer; transition: background .2s, color .2s, transform .15s; }
.ibtn:hover { background: var(--surface2); color: var(--fg); }
.ibtn:active { transform: scale(.92); }
.ibtn.on { color: var(--tc); background: color-mix(in srgb, var(--tc) 14%, transparent); }
.ibtn.sm { width: 32px; height: 32px; border-radius: 10px; }
.ibtn.danger:hover { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }
.ibtn[disabled] { opacity: .3; pointer-events: none; }

/* ---------- űrlap ---------- */
input[type=text], input[type=search], input[type=number], input[type=url], select, textarea {
  width: 100%; min-height: 42px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line2); background: var(--surface); color: var(--fg);
  font: inherit; font-size: .96rem; transition: border-color .2s, box-shadow .2s;
}
textarea { min-height: 90px; resize: vertical; line-height: 1.45; }
input::placeholder, textarea::placeholder { color: var(--fg3); }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--tc); box-shadow: 0 0 0 3px color-mix(in srgb, var(--tc) 24%, transparent); }
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--fg2) 50%), linear-gradient(135deg, var(--fg2) 50%, transparent 50%); background-position: calc(100% - 18px) 52%, calc(100% - 13px) 52%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 34px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .lbl { font-size: .8rem; font-weight: 700; color: var(--fg2); letter-spacing: .04em; text-transform: uppercase; }
.field .hint { font-size: .8rem; color: var(--fg3); }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
.codebox { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: .8rem; line-height: 1.5; word-break: break-all; }
input[type=range] { width: 100%; accent-color: var(--tc); min-height: 28px; }
input[type=checkbox], input[type=radio] { accent-color: var(--tc); width: 18px; height: 18px; }

.switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 600; user-select: none; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch .tr { position: relative; width: 44px; height: 26px; border-radius: 999px; background: var(--line2); transition: background .25s; flex: none; }
.switch .tr::after { content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .35); transition: transform .25s cubic-bezier(.3, 1.4, .5, 1); }
.switch input:checked + .tr { background: var(--tc); }
.switch input:checked + .tr::after { transform: translateX(18px); }
.switch input:focus-visible + .tr { outline: 2px solid var(--tc); outline-offset: 2px; }

.chip { display: inline-flex; align-items: center; gap: 7px; min-height: 38px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line2); background: var(--surface); color: var(--fg2); font-weight: 600; font-size: .92rem; cursor: pointer; white-space: nowrap; transition: all .2s; }
.chip:hover { color: var(--fg); background: var(--raise); }
.chip.on { background: color-mix(in srgb, var(--tc) 18%, var(--surface)); color: var(--fg); border-color: var(--tc); box-shadow: 0 0 0 1px color-mix(in srgb, var(--tc) 40%, transparent); }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: .74rem; font-weight: 700; background: var(--surface2); color: var(--fg2); letter-spacing: .02em; border: 1px solid var(--line); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; box-shadow: var(--shadow-s); }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.spacer { flex: 1; }

/* ---------- modal ---------- */
.modal-back { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) var(--gut) max(16px, env(safe-area-inset-bottom, 0px)); background: rgba(14, 5, 12, .6); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); animation: fadein .18s ease both; }
.modal-back.out { animation: fadeout .17s ease both; }
.modal { width: 100%; max-width: 560px; max-height: min(90vh, 900px); display: flex; flex-direction: column; background: var(--surface); color: var(--fg); border: 1px solid var(--line2); border-radius: 22px; box-shadow: 0 30px 80px rgba(0, 0, 0, .45); animation: popin .24s cubic-bezier(.2, 1.1, .4, 1) both; overflow: hidden; }
.modal.small { max-width: 420px; }
.modal.wide { max-width: 860px; }
.modal-back.out .modal { animation: popout .17s ease both; }
.modal-head { display: flex; align-items: center; gap: 10px; padding: 16px 16px 6px 22px; }
.modal-head h2 { flex: 1; font-size: 1.4rem; }
.modal-body { padding: 8px 22px 18px; overflow: auto; display: flex; flex-direction: column; gap: 14px; overscroll-behavior: contain; }
.modal-foot { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 10px; padding: 12px 22px 16px; border-top: 1px solid var(--line); background: var(--surface); }
.ask-text { color: var(--fg2); }
@keyframes fadein { from { opacity: 0; } }
@keyframes fadeout { to { opacity: 0; } }
@keyframes popin { from { opacity: 0; transform: translateY(14px) scale(.96); } }
@keyframes popout { to { opacity: 0; transform: translateY(8px) scale(.97); } }
@media (max-width: 560px) {
  .modal-back { place-items: end center; padding: 0; }
  .modal, .modal.small, .modal.wide { max-width: none; border-radius: 22px 22px 0 0; max-height: 92vh; padding-bottom: env(safe-area-inset-bottom, 0px); animation-name: sheetin; }
  .modal-back.out .modal { animation-name: sheetout; }
  .modal-head h2 { font-size: 1.25rem; }
}
@keyframes sheetin { from { transform: translateY(40px); opacity: 0; } }
@keyframes sheetout { to { transform: translateY(30px); opacity: 0; } }

/* ---------- toast ---------- */
#toasts { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 120; display: flex; flex-direction: column; align-items: center; gap: 8px; width: min(92vw, 460px); pointer-events: none; }
.toast { background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 14px; font-weight: 600; font-size: .92rem; box-shadow: var(--shadow); animation: toastin .3s cubic-bezier(.2, 1.2, .4, 1) both; text-align: center; }
.toast.out { animation: toastout .25s ease both; }
@keyframes toastin { from { opacity: 0; transform: translateY(14px) scale(.95); } }
@keyframes toastout { to { opacity: 0; transform: translateY(8px); } }
@media (max-width: 800px) { #toasts { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); } }

#fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 90; pointer-events: none; }

/* ---------- nézetváltás ---------- */
.view-in { animation: viewin .4s cubic-bezier(.2, .9, .3, 1) both; }
@keyframes viewin { from { opacity: 0; transform: translateY(12px); } }
.page-title { display: flex; flex-wrap: wrap; align-items: end; gap: 6px 16px; margin: 10px 0 18px; }
.page-title h1 { font-size: clamp(1.7rem, 4.5vw, 2.4rem); }
.page-title p { color: var(--fg2); max-width: 60ch; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
  #bg i { animation: none !important; }
}
.no-motion *, .no-motion *::before, .no-motion *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
.no-motion #bg i { animation: none !important; }


/* ===== Dobás nézet ===== */
.play { display: flex; flex-direction: column; gap: 18px; padding-top: 6px; }

.themebar { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px; margin-inline: -2px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.themebar::-webkit-scrollbar { display: none; }
.theme-chip .ce { font-size: 1.15rem; line-height: 1; }
.theme-chip.on { background: color-mix(in srgb, var(--tc) 22%, var(--surface)); border-color: var(--tc); }
.add-chip { border-style: dashed; background: transparent; }

.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.chaos { display: flex; align-items: center; gap: 10px; width: 180px; animation: fadein .3s both; }
.chaos[hidden] { display: none; }

/* ---------- a tábla ---------- */
.board {
  --s: clamp(100px, 10.5vw, 124px); --c: calc(var(--s) * .86);
  position: relative; padding: 24px 16px 28px; border-radius: 28px;
  background: radial-gradient(120% 90% at 50% 0%, #fffdf8, var(--board) 52%, var(--board2));
  border: 1px solid rgba(160, 110, 50, .38);
  box-shadow: 0 1px 0 rgba(255, 255, 255, .95) inset, 0 7px 0 -1px var(--wood2), 0 8px 0 -1px rgba(90, 50, 10, .45), var(--shadow), 0 0 90px var(--glow);
  margin-bottom: 8px;
}
.board::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: repeating-linear-gradient(90deg, rgba(150, 100, 40, .035) 0 2px, transparent 2px 9px); mix-blend-mode: multiply; }
.board-title { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 4px 16px; text-align: center; font-family: var(--f-display); text-transform: uppercase; letter-spacing: .2em; font-size: clamp(1.05rem, 3.6vw, 1.85rem); color: var(--boardink); text-shadow: 0 1px 0 rgba(255, 255, 255, .85), 0 -1px 0 rgba(120, 80, 30, .25); }
.bt-theme { color: color-mix(in srgb, var(--tc) 68%, #6a4a20); }
.board-desc { text-align: center; margin: 8px auto 4px; max-width: 56ch; font-size: .88rem; letter-spacing: .03em; color: var(--boardink); text-shadow: 0 1px 0 rgba(255, 255, 255, .7); }
.heart-piece { border: 0; background: none; padding: 2px; cursor: pointer; filter: drop-shadow(0 3px 2px rgba(80, 20, 20, .4)); transform: rotate(-6deg); transition: transform .25s cubic-bezier(.3, 1.6, .5, 1); animation: beat 3.4s ease-in-out infinite; line-height: 0; }
.heart-piece:hover { transform: rotate(5deg) scale(1.14); }
@keyframes beat { 0%, 62%, 100% { scale: 1; } 70% { scale: 1.1; } 78% { scale: .98; } 86% { scale: 1.06; } }

.slots { display: flex; flex-wrap: wrap; justify-content: center; gap: 26px 12px; margin-top: 22px; position: relative; z-index: 1; }
.slot { position: relative; width: calc(var(--s) + 26px); display: flex; flex-direction: column; align-items: center; gap: 12px; animation: slotin .55s cubic-bezier(.2, 1.2, .4, 1) both; animation-delay: calc(var(--i) * 55ms); }
@keyframes slotin { from { opacity: 0; transform: translateY(-28px) scale(.9); } }

.stage { position: relative; width: calc(var(--s) + 18px); height: calc(var(--s) + 12px); display: grid; place-items: center; perspective: 760px; cursor: pointer; border-radius: 12px; -webkit-user-select: none; user-select: none; }
.stage::before { content: ""; position: absolute; inset: 0; border-radius: 12px; background: linear-gradient(160deg, #e6d1a8, #f3e5c6); box-shadow: inset 0 3px 9px rgba(90, 55, 15, .42), inset 0 -1px 0 rgba(255, 255, 255, .75), 0 1px 0 rgba(255, 255, 255, .85); transition: box-shadow .3s; }
.slot.locked .stage::before { box-shadow: inset 0 3px 9px rgba(90, 55, 15, .42), 0 0 0 2px #e0a62f, 0 0 24px rgba(255, 186, 60, .65); }
.cshadow { position: absolute; left: 12%; bottom: 7px; width: 76%; height: 14px; background: radial-gradient(ellipse at center, rgba(60, 30, 5, .6), transparent 70%); filter: blur(2px); opacity: .6; pointer-events: none; }
.toss { position: relative; width: var(--c); height: var(--c); transform-style: preserve-3d; transition: transform .22s; }
.stage:hover .toss { transform: translateY(-3px); }
.stage:active .toss { transform: translateY(1px) scale(.97); }
.tilt { width: 100%; height: 100%; transform-style: preserve-3d; transform: rotateX(-14deg) rotateY(-18deg); }
.cube { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transform: rotateX(0deg) rotateY(0deg); will-change: transform; }
.face { position: absolute; inset: 0; display: grid; place-items: center; padding: calc(var(--c) * .08); border-radius: calc(var(--c) * .06); overflow: hidden; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background: repeating-linear-gradient(94deg, rgba(120, 70, 20, .08) 0 1px, transparent 1px 6px), radial-gradient(120% 120% at 25% 15%, var(--wood1), var(--wood2));
  box-shadow: inset 0 0 0 1.5px rgba(255, 246, 220, .4), inset 0 0 calc(var(--c) * .16) rgba(110, 60, 15, .38); }
.face::after { content: ""; position: absolute; inset: 0; background: #2a1406; opacity: var(--dk, 0); transition: opacity var(--dur, 0ms) ease-out; pointer-events: none; }
.fc0 { transform: translateZ(calc(var(--c) / 2)); }
.fc1 { transform: rotateY(180deg) translateZ(calc(var(--c) / 2)); }
.fc2 { transform: rotateY(90deg) translateZ(calc(var(--c) / 2)); }
.fc3 { transform: rotateY(-90deg) translateZ(calc(var(--c) / 2)); }
.fc4 { transform: rotateX(90deg) translateZ(calc(var(--c) / 2)); }
.fc5 { transform: rotateX(-90deg) translateZ(calc(var(--c) / 2)); }
.ft { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 6; overflow: hidden; max-width: 100%; text-align: center; font-family: var(--f-cube); font-weight: 700; text-transform: uppercase; letter-spacing: .045em; line-height: 1.16; color: var(--woodink); text-shadow: 0 1px 0 rgba(255, 238, 205, .65), 0 -1px 0 rgba(70, 35, 10, .2); overflow-wrap: anywhere; hyphens: auto; -webkit-hyphens: auto; }
.f1 { font-size: max(12.5px, calc(var(--c) * .15)); }
.f2 { font-size: max(10.5px, calc(var(--c) * .125)); }
.f3 { font-size: max(9px, calc(var(--c) * .106)); }
.f4 { font-size: max(8.2px, calc(var(--c) * .092)); }
.f5 { font-size: max(7.6px, calc(var(--c) * .082)); letter-spacing: .02em; }

.lockbtn { position: absolute; top: -9px; right: -2px; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; border: 1px solid var(--boardline); background: var(--board); color: var(--boardink); box-shadow: 0 2px 6px rgba(80, 40, 10, .3); transition: background .2s, color .2s, transform .2s; z-index: 3; }
.lockbtn::after { content: ""; position: absolute; inset: -6px; }
.lockbtn:hover { transform: scale(1.1); color: var(--woodink); }
.slot.locked .lockbtn { background: #e0a62f; color: #3d2208; border-color: #b9821a; box-shadow: 0 0 14px rgba(255, 186, 60, .8), 0 2px 6px rgba(80, 40, 10, .3); }
.sflag { position: absolute; top: -9px; left: -2px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; z-index: 3; box-shadow: 0 2px 6px rgba(80, 40, 10, .3); animation: popin .3s both; }
.sflag[hidden] { display: none; }
.sflag.s { background: #8d5fd6; color: #fff; }
.sflag.c { background: #e8a23c; color: #3d2208; }
.slot-label { display: flex; align-items: baseline; justify-content: center; gap: 6px; max-width: 100%; text-align: center; font-family: var(--f-display); text-transform: uppercase; letter-spacing: .11em; font-size: .78rem; line-height: 1.25; color: var(--boardink); text-shadow: 0 1px 0 rgba(255, 255, 255, .8); }
.slot-label .num { flex: none; font-family: var(--f-ui); font-size: .62rem; letter-spacing: 0; padding: 0 4px; border: 1px solid var(--boardline); border-radius: 5px; opacity: .8; }
.empty-board { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 28px 12px; color: var(--boardink); text-align: center; }

/* ---------- gombsor + eredmények ---------- */
.rollbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 14px 18px; }
.rollbar-sec { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.roll-btn { min-width: 210px; animation: idleglow 3.2s ease-in-out infinite; }
.roll-btn .ic svg { transition: transform .5s cubic-bezier(.3, 1.4, .5, 1); }
.roll-btn:hover .ic svg { transform: rotate(180deg); }
@keyframes idleglow { 50% { box-shadow: 0 6px 26px color-mix(in srgb, var(--tc) 55%, transparent), inset 0 1px 0 rgba(255, 255, 255, .3); } }
.btn.faved { color: var(--tc); border-color: var(--tc); background: color-mix(in srgb, var(--tc) 14%, var(--surface2)); }
.btn.faved .ic svg { fill: currentColor; }

.result-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 14px; margin: 8px 0 12px; }
.result-head h2 { font-size: 1.5rem; }
.rows { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 12px; }
.rrow { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 4px 14px; align-items: start; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-s); animation: rowin .5s cubic-bezier(.2, 1, .3, 1) both; animation-delay: calc(var(--i) * 45ms); transition: border-color .3s, box-shadow .3s; }
@keyframes rowin { from { opacity: 0; transform: translateY(12px); } }
.rrow.locked { border-color: color-mix(in srgb, #e0a62f 70%, transparent); box-shadow: var(--shadow-s), 0 0 0 1px color-mix(in srgb, #e0a62f 40%, transparent); }
.rrow.pop { animation: rpop .6s cubic-bezier(.2, 1.3, .4, 1); }
@keyframes rpop { 0% { transform: scale(.97); box-shadow: 0 0 0 0 color-mix(in srgb, var(--tc) 60%, transparent); } 55% { transform: scale(1.012); box-shadow: 0 0 0 9px transparent; } 100% { transform: scale(1); } }
.ricon { width: 46px; height: 46px; display: grid; place-items: center; font-size: 1.5rem; border-radius: 13px; background: color-mix(in srgb, var(--tc) 13%, var(--surface2)); }
.rmain { min-width: 0; display: flex; flex-direction: column; gap: 3px; padding-top: 1px; }
.rlabel { font-size: .7rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--fg3); }
.rtext { font-size: 1.08rem; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; min-height: 1.3em; }
.rmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: .86rem; }
.rmeta:empty, .rflags:empty { display: none; }
.rflags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.flag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px 2px 7px; border-radius: 999px; font-size: .74rem; font-weight: 700; }
.flag.s { background: color-mix(in srgb, #9b6bdb 20%, transparent); color: color-mix(in srgb, #8d5fd6 80%, var(--fg)); }
.flag.c { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.ractions { display: flex; gap: 2px; margin: -4px -6px 0 0; }
@media (hover: hover) {
  .ractions .ibtn:not(.on) { opacity: 0; transition: opacity .2s, background .2s, color .2s; }
  .rrow:hover .ractions .ibtn, .rrow:focus-within .ractions .ibtn { opacity: 1; }
}
.rrow.rolling .rtext { width: min(72%, 220px); border-radius: 8px; color: transparent; background: linear-gradient(90deg, var(--surface2), var(--raise), var(--surface2)); background-size: 200% 100%; animation: shimmer 1s linear infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }
.hint { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 6px; text-align: center; color: var(--fg2); font-size: .86rem; margin-top: 4px; }
.hint .ic { color: var(--tc); }

.picklist { display: flex; flex-direction: column; gap: 6px; }
.pickitem { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface2); cursor: pointer; font-weight: 500; transition: background .15s, border-color .15s; }
.pickitem:hover { background: var(--raise); border-color: var(--line2); }
.pickitem.cur { border-color: var(--tc); background: color-mix(in srgb, var(--tc) 14%, var(--surface2)); }
.pickitem .pt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.aspects { display: flex; flex-direction: column; gap: 8px; }
.asp { display: flex; width: 100%; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface2); }
.asp .asp-n { flex: 1; min-width: 0; }
.asp .ae { font-size: 1.15rem; }
.asp.dim { opacity: .55; }

@media (max-width: 800px) {
  .toolbar { gap: 8px 12px; }
  .toolbar .hide-sm { display: none; }
  .board { --s: clamp(76px, 20.5vw, 120px); padding: 20px 12px 24px; border-radius: 24px; }
  .slot { width: calc(var(--s) + 20px); }
  .stage { width: calc(var(--s) + 14px); height: calc(var(--s) + 8px); }
  .slots { gap: 22px 8px; }
  .slot-label { font-size: .68rem; letter-spacing: .08em; }
  .roll-btn { width: 100%; }
  .rrow { grid-template-columns: 42px minmax(0, 1fr) auto; padding: 12px; gap: 4px 12px; }
  .ricon { width: 42px; height: 42px; }
}


/* ===== Szerkesztő ===== */
.editor-grid { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 22px; align-items: start; }
.ed-side { position: sticky; top: 78px; display: flex; flex-direction: column; gap: 8px; max-height: calc(100vh - 100px); overflow-y: auto; padding: 2px; }
.ed-theme { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 10px 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; transition: background .2s, border-color .2s, transform .15s; }
.ed-theme:hover { background: var(--raise); transform: translateX(2px); }
.ed-theme.on { border-color: var(--tc); background: color-mix(in srgb, var(--tc) 14%, var(--surface)); box-shadow: 0 0 0 1px color-mix(in srgb, var(--tc) 35%, transparent); }
.et-e { font-size: 1.5rem; line-height: 1; }
.et-t { display: flex; flex-direction: column; min-width: 0; }
.et-t b { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.et-t small { color: var(--fg3); font-size: .76rem; }
.side-new, .side-imp { justify-content: flex-start; }
.ed-main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

.theme-card { display: flex; flex-direction: column; gap: 14px; }
.tc-top { display: flex; align-items: end; gap: 14px; }
.icon-pick { width: 42px; height: 42px; flex: none; display: grid; place-items: center; font-size: 1.35rem; border-radius: 12px; border: 1px solid var(--line2); background: var(--surface2); cursor: pointer; transition: transform .15s, background .2s; line-height: 1; }
.icon-pick:hover { background: var(--raise); transform: scale(1.06); }
.icon-pick.big { width: 52px; height: 52px; font-size: 1.7rem; border-radius: 14px; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.swatch { width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .35), 0 1px 3px rgba(0, 0, 0, .3); transition: transform .15s; padding: 0; }
.swatch:hover { transform: scale(1.12); }
.swatch.on { border-color: var(--fg); transform: scale(1.1); }
.swatch-custom { width: 34px; height: 34px; padding: 0; border: 0; border-radius: 50%; background: none; cursor: pointer; min-height: 0; }
.tc-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-top: 4px; border-top: 1px solid var(--line); margin-top: 2px; padding-top: 14px; }
.ibtn.off { opacity: .28; pointer-events: none; }

.ed-dice-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-top: 6px; }
.ed-dice-head h2 { font-size: 1.5rem; }
.ed-dice-head .btn { align-self: center; }
.die-list { display: flex; flex-direction: column; gap: 12px; }
.die-card { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; transition: opacity .2s, border-color .2s; }
.die-card.open { border-color: color-mix(in srgb, var(--tc) 45%, var(--line)); }
.die-card.off { opacity: .6; }
.die-head { display: flex; align-items: center; gap: 8px; }
.die-head .dn { min-width: 0; }
.die-head input[type=text] { font-weight: 600; background: transparent; border-color: transparent; }
.die-head input[type=text]:hover { border-color: var(--line2); }
.die-head input[type=text]:focus { background: var(--surface); }
.cnt { min-width: 34px; justify-content: center; }
.switch.mini { gap: 0; }
.ibtn.tog.on { color: var(--tc); }
.die-peek { display: flex; flex-wrap: wrap; gap: 6px; text-align: left; background: none; border: 0; padding: 0 2px; cursor: pointer; }
.peek-o { padding: 3px 10px; border-radius: 999px; background: var(--surface2); font-size: .82rem; color: var(--fg2); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 1px solid var(--line); }
.peek-o.s { border-style: dashed; }
.peek-more { padding: 3px 4px; font-size: .82rem; color: var(--tc); font-weight: 600; }
.die-body { display: flex; flex-direction: column; gap: 12px; animation: fadein .25s both; }
.opts { display: flex; flex-direction: column; gap: 6px; max-height: 62vh; overflow-y: auto; padding: 2px 4px 2px 2px; margin-right: -4px; overscroll-behavior: contain; }
.orow { display: flex; flex-direction: column; gap: 8px; border-radius: 12px; }
.orow[hidden] { display: none; }
.orow.adv { background: var(--surface2); padding: 8px; border: 1px solid var(--line); }
.orow-main { display: flex; align-items: center; gap: 4px; }
.orow-main input { flex: 1; min-width: 0; min-height: 40px; }
.tagbtn { position: relative; }
.badge { position: absolute; top: 0; right: 0; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--tc); color: #fff; font-size: .65rem; font-weight: 700; display: grid; place-items: center; line-height: 1; }
.adv-panel { display: flex; flex-direction: column; gap: 12px; animation: fadein .2s both; }
.adv-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.tagpick { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tagchip { padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line2); background: var(--surface); color: var(--fg2); font-size: .8rem; cursor: pointer; }
.tagchip:hover { color: var(--fg); border-color: var(--tc); }
.addrow { display: flex; gap: 8px; }
.die-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.empty-note { padding: 8px 4px; }
.role-field { max-width: 420px; }
.bulk { min-height: 46vh; word-break: normal; }

.emoji-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; }
.emoji-btn { aspect-ratio: 1; font-size: 1.5rem; border-radius: 12px; border: 1px solid var(--line); background: var(--surface2); cursor: pointer; transition: transform .15s, background .2s; line-height: 1; }
.emoji-btn:hover { transform: scale(1.12); background: var(--raise); }
.nt-tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.nt-pane, .nt-common { display: flex; flex-direction: column; gap: 14px; }
.toast.act { display: flex; align-items: center; gap: 14px; text-align: left; }
.toast-btn { background: none; border: 0; color: var(--bg); font-weight: 800; text-decoration: underline; cursor: pointer; padding: 4px; }

@media (max-width: 800px) {
  .editor-grid { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .ed-side { position: static; flex-direction: row; overflow-x: auto; max-height: none; padding-bottom: 6px; scrollbar-width: none; }
  .ed-side::-webkit-scrollbar { display: none; }
  .ed-theme { width: auto; flex: none; padding: 8px 12px; }
  .et-t small { display: none; }
  .side-new, .side-imp { flex: none; }
  .die-head { flex-wrap: wrap; }
  .die-head .dn { flex-basis: calc(100% - 110px); }
}


/* ===== Könyvespolc ===== */
.shelf-body { display: flex; flex-direction: column; gap: 16px; }
.shelf-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.stat { display: flex; flex-direction: column; gap: 2px; padding: 12px 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.stat b { font-family: var(--f-display); font-size: 1.9rem; font-weight: 400; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { color: var(--fg2); font-size: .82rem; }
.banner { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 12px 16px; background: color-mix(in srgb, var(--tc) 9%, var(--surface)); }

.shelf-tools { display: flex; flex-direction: column; gap: 10px; }
.shelf-tools select { width: auto; min-width: 150px; }
.search-wrap { min-width: 200px; }
.book-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 12px; }
.book { --hue: 20; display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 14px; padding: 14px 14px 14px 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-s); overflow: hidden; animation: rowin .4s both; transition: transform .2s, box-shadow .2s; }
.book:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.spine { background: linear-gradient(180deg, hsl(var(--hue) 50% 52%), hsl(calc(var(--hue) + 20) 55% 38%)); border-radius: 0 3px 3px 0; box-shadow: inset -2px 0 3px rgba(0, 0, 0, .18); }
.bk-main { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.bk-main h3 { font-family: var(--f-ui); font-weight: 700; font-size: 1.02rem; line-height: 1.3; overflow-wrap: anywhere; }

.bk-tags { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin-top: 2px; }
.pill.mood { background: color-mix(in srgb, var(--tc) 12%, var(--surface2)); }
.bk-pages { color: var(--fg3); font-size: .78rem; }
.bk-note { font-size: .84rem; color: var(--fg2); font-style: italic; margin-top: 2px; }
.bk-side { display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; gap: 8px; }
.st { padding: 3px 11px; border-radius: 999px; font-size: .74rem; font-weight: 700; border: 1px solid var(--line2); background: var(--surface2); cursor: pointer; color: var(--fg2); transition: transform .15s; }
.st:hover { transform: scale(1.06); }
.st-olvasom { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 50%, transparent); }
.st-elolvastam { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
.empty-shelf { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; padding: 38px 20px; }
.empty-shelf .big { font-size: 3rem; line-height: 1; }
.more-wrap { display: flex; justify-content: center; }
.imp-preview { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 12px; background: var(--surface2); border: 1px solid var(--line); min-height: 64px; }
.tbl-wrap { overflow-x: auto; }
.imp-table { width: 100%; border-collapse: collapse; font-size: .84rem; }
.imp-table th { text-align: left; font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--fg3); padding: 4px 10px 6px 0; }

<script>
/* ===== Engine: DSL + koherens sorsoló motor ===== */
const Engine = (() => {
  'use strict';

  const slug = s => String(s == null ? '' : s).toLowerCase().normalize('NFD')
    .replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');

  let _n = 0;
  const uid = () => 'i' + Date.now().toString(36).slice(-4) + (++_n).toString(36) + Math.random().toString(36).slice(2, 6);

  const uniq = a => Array.from(new Set(a));

  /* ---------- DSL: "Szöveg #cimke !utkozik ?kell|vagy +szivesen ~" ---------- */
  function parseLine(line) {
    const o = { id: uid(), t: '', g: [], x: [], n: [], w: [], s: false };
    const words = [];
    String(line).trim().split(/\s+/).forEach(tok => {
      if (!tok) return;
      const c = tok[0], rest = tok.slice(1);
      if (c === '~' && !rest) { o.s = true; return; }
      if (rest && '#!?+'.indexOf(c) >= 0) {
        if (c === '?') {
          const grp = uniq(rest.split('|').map(slug).filter(Boolean));
          if (grp.length) o.n.push(grp);
        } else {
          const t = slug(rest);
          if (!t) return;
          (c === '#' ? o.g : c === '!' ? o.x : o.w).push(t);
        }
        return;
      }
      words.push(tok);
    });
    o.t = words.join(' ');
    o.g = uniq(o.g); o.x = uniq(o.x); o.w = uniq(o.w);
    return o;
  }

  function fmtLine(o) {
    return [o.t]
      .concat(o.g.map(t => '#' + t), o.x.map(t => '!' + t), o.n.map(g => '?' + g.join('|')), o.w.map(t => '+' + t), o.s ? ['~'] : [])
      .filter(Boolean).join(' ');
  }

  function parseLines(text) {
    return String(text).split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(parseLine).filter(o => o.t);
  }

  /* ---------- segédek ---------- */
  const splitList = s => String(s || '').split(/[,;\/|]+/).map(x => x.trim()).filter(Boolean);
  const hasAny = (arr, set) => { for (let i = 0; i < arr.length; i++) if (set.has(arr[i])) return true; return false; };
  const inter = (a, b) => { for (let i = 0; i < a.length; i++) if (b.indexOf(a[i]) >= 0) return true; return false; };

  function shuffle(arr, R) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  function wchoose(items, weights, R) {
    let tot = 0; for (let i = 0; i < weights.length; i++) tot += weights[i];
    let r = R() * tot;
    for (let i = 0; i < items.length; i++) { r -= weights[i]; if (r <= 0) return items[i]; }
    return items[items.length - 1];
  }

  const allowed = (die, ctx) => (die.options || []).filter(o => o.t && (ctx.surreal || !o.s));

  const conflict = (a, b) => inter(a.x, b.g) || inter(b.x, a.g);

  /* címke-szolgáltatók: melyik kocka milyen címkéket adhat (az engedélyezett opciókból) */
  function providers(dice, ctx) {
    const prov = {};
    dice.forEach(d => {
      if (d.kind === 'shelf') return;
      const s = new Set();
      allowed(d, ctx).forEach(o => o.g.forEach(t => s.add(t)));
      prov[d.id] = s;
    });
    return prov;
  }

  const satisfiable = (grp, ownId, dice, prov) =>
    dice.some(d => d.id !== ownId && prov[d.id] && grp.some(t => prov[d.id].has(t)));

  function unmetGroups(opt, ownId, picks, dice, prov) {
    const out = [];
    opt.n.forEach(grp => {
      if (!satisfiable(grp, ownId, dice, prov)) return;       // senki nem tud ilyet adni → nem büntetjük
      let ok = false;
      for (const id in picks) {
        if (id === ownId) continue;
        const po = picks[id] && picks[id].opt;
        if (po && inter(po.g, grp)) { ok = true; break; }
      }
      if (!ok) out.push(grp);
    });
    return out;
  }

  /* ---------- ellenőrzés ---------- */
  function violations(dice, picks, prov) {
    const conflicts = [], unmet = [];
    const ids = dice.map(d => d.id).filter(id => picks[id] && picks[id].opt);
    for (let i = 0; i < ids.length; i++) {
      const a = picks[ids[i]].opt;
      for (let j = i + 1; j < ids.length; j++) {
        const b = picks[ids[j]].opt;
        if (conflict(a, b)) conflicts.push([ids[i], ids[j]]);
      }
      unmetGroups(a, ids[i], picks, dice, prov).forEach(grp => unmet.push({ die: ids[i], group: grp }));
    }
    return { count: conflicts.length + unmet.length, conflicts, unmet };
  }

  function annotate(dice, picks, ctx) {
    const prov = providers(dice, ctx);
    const v = violations(dice, picks, prov);
    const bad = new Set();
    v.conflicts.forEach(c => { bad.add(c[0]); bad.add(c[1]); });
    v.unmet.forEach(u => bad.add(u.die));
    for (const id in picks) {
      const p = picks[id]; if (!p || !p.opt) continue;
      p.flag = p.opt.s ? 's' : (bad.has(id) ? 'c' : '');
    }
    return v;
  }

  const sw = ctx => 0.5 + 1.8 * (ctx.chaos == null ? 0.35 : ctx.chaos);

  /* ---------- súlyozás ---------- */
  function prefWeight(o, die, others, dice, prov, ctx) {
    const have = new Set(), want = new Set(), unmet = new Set();
    for (const id in others) {
      const po = others[id] && others[id].opt;
      if (!po || id === die.id) continue;
      po.g.forEach(t => have.add(t));
      po.w.forEach(t => want.add(t));
      unmetGroups(po, id, others, dice, prov).forEach(g => g.forEach(t => unmet.add(t)));
    }
    let w = (ctx.surreal && o.s) ? sw(ctx) : 1;
    if (hasAny(o.g, want)) w *= 3;
    if (hasAny(o.w, have)) w *= 3;
    if (hasAny(o.g, unmet)) w *= 4;
    const ng = o.n.filter(grp => satisfiable(grp, die.id, dice, prov));
    if (ng.length) w *= ng.every(grp => hasAny(grp, have)) ? 2 : 0.35;
    return w;
  }

  function chooseOpt(die, dice, picks, ctx, prov, R, excludeId) {
    let cands = allowed(die, ctx);
    if (!cands.length) return null;
    if (excludeId && cands.length > 1) cands = cands.filter(o => o.id !== excludeId);
    const scored = cands.map(o => {
      let conf = 0;
      for (const id in picks) {
        const po = picks[id] && picks[id].opt;
        if (po && id !== die.id && conflict(o, po)) conf++;
      }
      return { o, conf };
    });
    const min = Math.min.apply(null, scored.map(s => s.conf));
    const pool = scored.filter(s => s.conf === min).map(s => s.o);
    const weights = pool.map(o => prefWeight(o, die, picks, dice, prov, ctx));
    return wchoose(pool, weights, R);
  }

  /* ---------- könyvespolc ---------- */
  const bookOpt = b => ({
    id: 'book:' + b.id,
    t: b.title + (b.author ? ' – ' + b.author : ''),
    g: uniq(splitList(b.genre).map(slug).concat(splitList(b.mood).map(slug))),
    x: [], n: [], w: [], s: false, book: b
  });

  const noBookOpt = () => ({ id: 'book:none', t: 'A polc üres – vegyél fel könyveket', g: [], x: [], n: [], w: [], s: false, book: null });

  function bookFilters(dice, picks) {
    const f = {};
    dice.forEach(d => {
      if (!d.role || d.kind === 'shelf' || !picks[d.id] || !picks[d.id].opt) return;
      const o = picks[d.id].opt;
      f[d.role] = new Set(o.g.concat([slug(o.t)]));
    });
    return f;
  }

  function bookMatches(b, f, skip) {
    if (f.genre && skip.indexOf('genre') < 0 && !f.genre.has('barmi')) {
      const gs = splitList(b.genre).map(slug);
      if (gs.length && !gs.some(g => f.genre.has(g))) return false;
    }
    if (f.mood && skip.indexOf('mood') < 0) {
      const ms = splitList(b.mood).map(slug);
      if (ms.length && !ms.some(m => f.mood.has(m))) return false;
    }
    if (f.length && skip.indexOf('length') < 0) {
      const p = +b.pages;
      if (p > 0) { const k = p < 250 ? 'rovid' : p < 500 ? 'kozepes' : 'hosszu'; if (!f.length.has(k)) return false; }
    }
    return true;
  }

  function pickBook(dice, picks, ctx, R, excludeId) {
    let books = (ctx.books || []).filter(b => b.title);
    if (ctx.onlyUnread) books = books.filter(b => b.status !== 'elolvastam');
    if (!books.length) return { opt: noBookOpt(), relaxed: [] };
    const f = bookFilters(dice, picks);
    const drops = [];
    let pool = books.filter(b => bookMatches(b, f, drops));
    for (const key of ['length', 'mood', 'genre']) {
      if (pool.length) break;
      drops.push(key);
      pool = books.filter(b => bookMatches(b, f, drops));
    }
    if (!pool.length) pool = books;
    if (excludeId && pool.length > 1) pool = pool.filter(b => b.id !== excludeId);
    const b = pool[Math.floor(R() * pool.length)];
    return { opt: bookOpt(b), relaxed: drops };
  }

  /* ---------- sorsolás ---------- */
  const rngOf = ctx => ctx.rng || Math.random;

  function rollAll(dice, cur, locks, ctx) {
    const R = rngOf(ctx);
    const prov = providers(dice, ctx);
    const normal = dice.filter(d => d.kind !== 'shelf');
    const shelf = dice.filter(d => d.kind === 'shelf');
    const base = {};
    dice.forEach(d => { if (locks[d.id] && cur[d.id]) base[d.id] = { opt: cur[d.id].opt, relaxed: cur[d.id].relaxed }; });

    if (ctx.surreal) {
      const pc = (ctx.chaos == null ? 0.35 : ctx.chaos) * 0.5;
      normal.forEach(d => {
        if (base[d.id] || R() >= pc) return;
        const c = allowed(d, ctx);
        if (!c.length) return;
        base[d.id] = { opt: wchoose(c, c.map(o => o.s ? sw(ctx) : 1), R) };
      });
    }

    const rest = normal.filter(d => !base[d.id]);
    let best = null, bs = Infinity;
    const attempts = rest.length ? 250 : 1;
    for (let a = 0; a < attempts; a++) {
      const picks = Object.assign({}, base);
      shuffle(rest, R).forEach(d => {
        const o = chooseOpt(d, dice, picks, ctx, prov, R, null);
        if (o) picks[d.id] = { opt: o };
      });
      const sc = violations(normal, picks, prov).count;
      if (sc < bs) { bs = sc; best = picks; if (sc === 0) break; }
    }
    best = best || Object.assign({}, base);
    shelf.forEach(d => {
      if (base[d.id]) { best[d.id] = base[d.id]; return; }
      const prev = cur[d.id] && cur[d.id].opt && cur[d.id].opt.book ? cur[d.id].opt.book.id : null;
      best[d.id] = pickBook(dice, best, ctx, R, prev);
    });
    annotate(dice, best, ctx);
    return best;
  }

  function rollOne(dice, dieId, cur, ctx) {
    const R = rngOf(ctx);
    const die = dice.find(d => d.id === dieId);
    if (!die) return cur;
    const next = Object.assign({}, cur);
    const prov = providers(dice, ctx);
    if (die.kind === 'shelf') {
      const prev = cur[dieId] && cur[dieId].opt && cur[dieId].opt.book ? cur[dieId].opt.book.id : null;
      next[dieId] = pickBook(dice, cur, ctx, R, prev);
      annotate(dice, next, ctx);
      return next;
    }
    const others = Object.assign({}, cur); delete others[dieId];
    const curId = cur[dieId] && cur[dieId].opt ? cur[dieId].opt.id : null;
    let cands = allowed(die, ctx);
    if (!cands.length) return next;
    if (curId && cands.length > 1) cands = cands.filter(o => o.id !== curId);

    let chosen;
    if (ctx.surreal && R() < (ctx.chaos == null ? 0.35 : ctx.chaos) * 0.5) {
      chosen = wchoose(cands, cands.map(o => o.s ? sw(ctx) : 1), R);
    } else {
      const normal = dice.filter(d => d.kind !== 'shelf');
      const scored = cands.map(o => {
        const p = Object.assign({}, others); p[dieId] = { opt: o };
        return { o, v: violations(normal, p, prov).count };
      });
      const min = Math.min.apply(null, scored.map(s => s.v));
      const pool = scored.filter(s => s.v === min).map(s => s.o);
      chosen = wchoose(pool, pool.map(o => prefWeight(o, die, others, dice, prov, ctx)), R);
    }
    next[dieId] = { opt: chosen };
    // a polc-kockát is frissítjük, ha a szűrő-kockák egyikét dobtuk újra
    dice.filter(d => d.kind === 'shelf').forEach(s => {
      if (die.role && !(cur[s.id] && cur[s.id].locked)) next[s.id] = pickBook(dice, next, ctx, R, null);
    });
    annotate(dice, next, ctx);
    return next;
  }

  /* kézzel választott opció állapota a többihez képest */
  function fits(dice, picks, dieId, opt, ctx) {
    const prov = providers(dice, ctx);
    const p = Object.assign({}, picks); p[dieId] = { opt };
    const normal = dice.filter(d => d.kind !== 'shelf');
    const base = Object.assign({}, picks); delete base[dieId];
    return violations(normal, p, prov).count <= violations(normal, base, prov).count;
  }

  return { slug, uid, uniq, parseLine, parseLines, fmtLine, splitList, rollAll, rollOne, violations, providers, annotate, allowed, bookOpt, noBookOpt, pickBook, fits, conflict };
})();


/* ===== Seed adatok: témák, kockák, példa könyvek (magyar) ===== */
const Seed = (() => {
  const VERSION = 1;
  const die = (id, name, icon, lines, extra) =>
    Object.assign({ id, name, icon, enabled: true, role: null, options: Engine.parseLines(lines) }, extra || {});
  const theme = (id, name, emoji, color, desc, dice) =>
    ({ id, name, emoji, color, desc, builtin: true, dice });

  /* ---------- Mozi: filmek tömör táblából → DSL ---------- */
  // [cím, műfajok, perc, év]
  const FILMS = [
    ['Amélie csodálatos élete', 'romantikus-film|vigjatek', 122, 2001],
    ['Notting Hill', 'romantikus-film|vigjatek', 124, 1999],
    ['Szerelmünk lapjai', 'romantikus-film|drama', 123, 2004],
    ['Dirty Dancing', 'romantikus-film|musical', 100, 1987],
    ['La La Land', 'musical|romantikus-film', 128, 2016],
    ['Mamma Mia!', 'musical|vigjatek|romantikus-film', 108, 2008],
    ['Moulin Rouge!', 'musical|romantikus-film|drama', 127, 2001],
    ['Grease', 'musical|romantikus-film', 110, 1978],
    ['A muzsika hangja', 'musical|drama', 174, 1965],
    ['Casablanca', 'romantikus-film|drama', 102, 1942],
    ['Vissza a jövőbe', 'scifi|vigjatek|kaland', 116, 1985],
    ['Csillagok háborúja: Egy új remény', 'scifi|akcio|kaland', 121, 1977],
    ['E.T., a földönkívüli', 'scifi|kaland', 115, 1982],
    ['Mátrix', 'scifi|akcio', 136, 1999],
    ['Interstellar', 'scifi|drama', 169, 2014],
    ['Eredet', 'scifi|thriller|akcio', 148, 2010],
    ['A marsi', 'scifi|drama|kaland', 144, 2015],

      foot.appendChild(btn(a.label, {

          if (r !== false) close(a.value);

  }
  api.foot = foot;
  back.appendChild(box);
  document.body.appendChild(back);
  document.documentElement.classList.add('modal-open');

  back.addEventListener('click', e => { if (e.target === back && down === back && !o.persistent) close(); });

async function copyText(text, srcEl) {
  try { await navigator.clipboard.writeText(text); toast('Vágólapra másolva'); return true; } catch (e) { }
  try {
    const ta = srcEl || h('textarea', { style: { position: 'fixed', left: '-999px', top: '0' } }, text);
    if (!srcEl) { ta.value = text; document.body.appendChild(ta); }
    ta.focus(); ta.select();
    const ok = document.execCommand && document.execCommand('copy');
    if (!srcEl) ta.remove();
    if (ok) { toast('Vágólapra másolva'); return true; }
  } catch (e) { }
  if (srcEl) { srcEl.focus(); srcEl.select(); }

}

  loop(t) {

function persistNow() {

}

  t.dice.forEach(d => {

'use strict';

/* a kocka hat lapja: CSS-transzformáció, lapnormális, és az a forgatás (rx, ry), ami a lapot előre hozza */
const FACES = [
  { n: [0, 0, 1], r: [0, 0] },    // elöl
  { n: [0, 0, -1], r: [0, 180] }, // hátul
  { n: [1, 0, 0], r: [0, -90] },  // jobb
  { n: [-1, 0, 0], r: [0, 90] },  // bal
  { n: [0, -1, 0], r: [-90, 0] }, // fent
  { n: [0, 1, 0], r: [90, 0] }    // lent
];
const TILT = { x: -14, y: -18 };
const LIGHT = (() => { const v = [-0.45, -0.7, 0.62], l = Math.hypot(v[0], v[1], v[2]); return v.map(x => x / l); })();

const mVec = (M, v) => M.map(r => r[0] * v[0] + r[1] * v[1] + r[2] * v[2]);
const TILT_M = mMul(mRx(TILT.x), mRy(TILT.y));

const P = { rid: 0, slots: {}, rows: {}, theme: null, entry: null, heartBtn: null, rollBtn: null };

function pickText(pick, die) {
  if (!pick || !pick.opt) return '–';
  return pick.opt.t;
}
function faceFit(text) {
  const n = String(text).length;
  return n <= 9 ? 'f1' : n <= 18 ? 'f2' : n <= 32 ? 'f3' : n <= 48 ? 'f4' : 'f5';
}
function faceShortText(pick) {
  if (pick && pick.opt && pick.opt.book) return pick.opt.book.title;
  return pickText(pick);
}
function randomFaceTexts(die, ctx, n, avoid) {
  let pool;
  if (die.kind === 'shelf') pool = S.books.filter(b => b.title).map(b => b.title);
  else pool = Engine.allowed(die, ctx).map(o => o.t);
  pool = pool.filter(t => t !== avoid);
  const out = [];
  const bag = pool.slice();
  for (let i = 0; i < n; i++) {
    if (!bag.length) { out.push(pool.length ? pick(pool) : '·'); continue; }
    out.push(bag.splice(rnd(bag.length), 1)[0]);

}

}

/* ---------- dobás-műveletek ---------- */
function rollAllAction() {
  const t = curTheme(), dice = activeDice(t), r = rtOf(t.id);
  if (!dice.length) { toast('Nincs bekapcsolt kocka. A Szempontok gombbal kapcsolhatsz be néhányat.'); return; }
  const free = dice.filter(d => !r.locks[d.id]);
  if (!free.length) { toast('Minden kocka zárolva. Oldj fel egyet, és újra dobhatsz.'); P.rollBtn && wiggle(P.rollBtn); Object.values(P.slots).forEach(s => wiggle(s.lockBtn)); return; }
  Sound.init();
  const next = Engine.rollAll(dice, curPicks(t, dice), r.locks, engineCtx());
  applyNext(t, dice, next, free.map(d => d.id), { record: true, all: true });
}
function rollOneAction(dieId) {
  const t = curTheme(), dice = activeDice(t), r = rtOf(t.id);
  const die = dice.find(d => d.id === dieId); if (!die) return;
  if (r.locks[dieId]) { toast('A(z) „' + die.name + '” kocka zárolva. Oldd fel a lakatra kattintva.'); const s = P.slots[dieId]; s && wiggle(s.lockBtn); return; }
  Sound.init();
  const before = curPicks(t, dice);
  if (!r.picks[dieId]) { rollAllAction(); return; }
  const next = Engine.rollOne(dice, dieId, before, engineCtx());
  const changed = dice.filter(d => next[d.id] && next[d.id] !== before[d.id]).map(d => d.id);
  applyNext(t, dice, next, changed.length ? changed : [dieId], { record: true });
}

function toggleLock(dieId) {

}

function toggleSurreal(on) {

  const cb = $('.chaos'); if (cb) cb.hidden = !on;

  else {

    const t = curTheme(), dice = activeDice(t), r = rtOf(t.id);
    const ids = dice.filter(d => !r.locks[d.id] && r.picks[d.id] && r.picks[d.id].opt && r.picks[d.id].opt.s).map(d => d.id);
    if (ids.length) {
      let ps = curPicks(t, dice); const ctx = engineCtx();
      ids.forEach(id => { ps = Engine.rollOne(dice, id, ps, ctx); });

/* a lényeg: új állapot alkalmazása + animáció + napló */
function applyNext(t, dice, next, ids, o) {
  o = o || {};
  const r = rtOf(t.id), rid = P.rid, ctx = engineCtx();
  dice.forEach(d => { if (next[d.id]) r.picks[d.id] = next[d.id]; });
  P.entry = null; updateFavBtn();
  persist();
  const animate = motionOK();
  let maxEnd = 0;
  ids.forEach((id, i) => {
    const sl = P.slots[id], row = P.rows[id], pk = r.picks[id];
    if (!sl || !pk) return;
    const delay = animate ? (o.intro ? 160 : 0) + i * 110 : 0;
    const dur = animate ? 1100 + rnd(280) + (o.all ? 0 : 100) : 0;
    maxEnd = Math.max(maxEnd, delay + dur);
    if (row && animate) { row.el.classList.add('rolling'); row.txt.textContent = ''; clear(row.meta); }
    const token = ++sl.token;
    const run = () => {
      if (sl.token !== token || rid !== P.rid) return;
      const txt = faceShortText(pk);
      const others = randomFaceTexts(sl.die, ctx, 4, txt);
      if (!animate) {
        setFaceText(sl.faces[sl.k], txt);
        let oi = 0; sl.faces.forEach((f, i) => { if (i !== sl.k) setFaceText(f, others[oi++ % others.length] || '·'); });
        return;
      }
      let k; do { k = rnd(6); } while (k === sl.k);
      setFaceText(sl.faces[k], txt);
      let oi = 0;
      sl.faces.forEach((f, i) => { if (i !== k && i !== sl.k) setFaceText(f, others[oi++ % others.length] || '·'); });
      const tr = FACES[k].r;
      const nrx = sl.rx + (((tr[0] - sl.rx) % 360) + 360) % 360 + 360 * (1 + rnd(2));
      const nry = sl.ry + (((tr[1] - sl.ry) % 360) + 360) % 360 + 360 * (2 + rnd(2));
      sl.cube.style.transition = 'transform ' + dur + 'ms cubic-bezier(.13,.78,.2,1)';
      sl.cube.style.transform = 'rotateX(' + nrx + 'deg) rotateY(' + nry + 'deg)';
      sl.rx = nrx; sl.ry = nry; sl.k = k;
      shadeFaces(sl, nrx, nry, dur);
      if (sl.toss.animate) {
        sl.toss.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(-38px)', offset: .27 }, { transform: 'translateY(0)', offset: .6 }, { transform: 'translateY(-10px)', offset: .78 }, { transform: 'translateY(0)' }], { duration: dur, easing: 'ease-out' });
        sl.shadow.animate([{ transform: 'scale(1)', opacity: .6 }, { transform: 'scale(.62)', opacity: .28, offset: .27 }, { transform: 'scale(1)', opacity: .6, offset: .6 }, { transform: 'scale(.86)', opacity: .45, offset: .78 }, { transform: 'scale(1)', opacity: .6 }], { duration: dur, easing: 'ease-out' });
      }
      Sound.roll(0);
      setTimeout(() => {
        if (sl.token !== token || rid !== P.rid) return;
        Sound.land(0);
        const b = sl.stage.getBoundingClientRect();
        FX.sparks(b.left + b.width / 2, b.top + b.height * 0.55, 7);
        setRowContent(id, pk); popRow(id); refreshSlotState(id);
      }, dur);
    };
    if (delay) setTimeout(run, delay); else run();
    if (!animate) { setRowContent(id, pk); }
  });
  refreshAllState();
  const finish = () => {
    if (rid !== P.rid) return;
    refreshAllState();
    if (o.record) recordHistory(t);
    const flagged = dice.some(d => r.picks[d.id] && r.picks[d.id].flag);
    if (o.all && ids.length >= 3 && !flagged && animate) {
      const b = $('.board'); if (b) { const rc = b.getBoundingClientRect(); FX.hearts(rc.left + rc.width / 2, Math.max(60, rc.top + 30), 20); }
      Sound.chime();
    }
  };
  if (maxEnd) setTimeout(finish, maxEnd + 40); else finish();
}

/* ---------- napló / kedvenc ---------- */
function resultItems(t) {
  const r = rtOf(t.id);
  return activeDice(t).filter(d => r.picks[d.id]).map(d => {
    const pk = r.picks[d.id];
    return { d: d.id, n: d.name, i: d.icon, t: pickText(pk), f: pk.flag || '' };
  });
}
function resultText(t) {
  const items = resultItems(t);
  return t.emoji + ' ' + t.name + '\n' + items.map(x => x.n + ': ' + x.t + (x.f === 's' ? ' (szürreális)' : '')).join('\n');
}
function recordHistory(t, force) {
  const r = rtOf(t.id), items = resultItems(t);
  if (!items.length) return null;
  const p = {}; items.forEach(x => { const pk = r.picks[x.d]; if (pk && pk.opt) p[x.d] = pk.opt.id; });
  const now = Date.now(), last = S.history[0];
  let e;
  if (!force && last && last.tid === t.id && !last.fav && now - last.ts < 6000) {
    last.ts = now; last.items = items; last.p = p; e = last;
  } else {
    e = { id: Engine.uid(), ts: now, tid: t.id, tn: t.name, te: t.emoji, items: items, p: p, fav: false };
    S.history.unshift(e);
    const keep = []; let n = 0;
    S.history.forEach(x => { if (x.fav) keep.push(x); else if (n++ < 80) keep.push(x); });
    S.history = keep;
  }
  P.entry = e; persist(); updateFavBtn();
  return e;
}
function toggleFavorite() {
  const t = curTheme();
  let e = P.entry;
  if (!e) e = recordHistory(t, true);
  if (!e) return;
  e.fav = !e.fav; persist(); updateFavBtn();
  if (e.fav) { Sound.init(); Sound.chime(); const b = P.heartBtn.getBoundingClientRect(); FX.hearts(b.left + b.width / 2, b.top, 14); toast('Elmentve a kedvencek közé'); }
  else toast('Kikerült a kedvencek közül');
}
function updateFavBtn() {
  if (!P.heartBtn) return;
  const on = !!(P.entry && P.entry.fav);

  P.heartBtn.setAttribute('aria-pressed', on ? 'true' : 'false');

}

/* ---------- kézi választás ---------- */
function pickModal(dieId) {
  const t = curTheme(), dice = activeDice(t), die = dice.find(d => d.id === dieId); if (!die) return;
  const r = rtOf(t.id), ctx = engineCtx();
  const list = h('div', { class: 'picklist', role: 'listbox' });
  const search = h('input', { type: 'search', placeholder: 'Keresés…', 'aria-label': 'Keresés', oninput: draw });
  let items;
  if (die.kind === 'shelf') items = S.books.filter(b => b.title).map(b => Engine.bookOpt(b));
  else items = Engine.allowed(die, ctx);
  const curId = r.picks[dieId] && r.picks[dieId].opt && r.picks[dieId].opt.id;
  const ps = curPicks(t, dice);
  let m;
  function draw() {
    const q = Engine.slug(search.value);
    clear(list);
    const shown = items.filter(o => !q || Engine.slug(o.t).indexOf(q) >= 0);
    if (!shown.length) list.appendChild(h('p', { class: 'muted' }, items.length ? 'Nincs találat.' : 'Ebben a kockában még nincs opció.'));
    shown.forEach(o => {
      const fit = die.kind === 'shelf' ? true : Engine.fits(dice, ps, dieId, o, ctx);
      list.appendChild(h('button', {
        type: 'button', role: 'option', class: 'pickitem' + (o.id === curId ? ' cur' : ''), 'aria-selected': o.id === curId ? 'true' : 'false',
        onclick: () => { m.close(); choosePick(t, dice, dieId, o); }
      }, h('span', { class: 'pt' }, o.t), o.s ? h('span', { class: 'flag s' }, ic('swirl', 12), 'szürreális') : null,
        !fit ? h('span', { class: 'flag c' }, ic('warn', 12), 'nem illik a többihez') : null,
        o.id === curId ? ic('check', 16) : null));
    });
  }
  m = openModal({
    title: die.icon + ' ' + die.name + ': választás', body: [items.length > 7 ? search : null, list],
    actions: [{ label: 'Mégse' }], focus: items.length > 7 ? 'input' : '.pickitem'
  });
  draw();
}
function choosePick(t, dice, dieId, opt) {
  const r = rtOf(t.id);
  Sound.init();
  const next = Object.assign({}, curPicks(t, dice));
  next[dieId] = { opt: opt };
  Engine.annotate(dice, next, engineCtx());
  applyNext(t, dice, next, [dieId], { record: true });
}

      btn('Másolat', { icon: 'copy', kind: 'sm', onclick: () => duplicateTheme(t) }),

function moveTheme(t, d) {
  const i = S.themes.indexOf(t), j = i + d;
  if (j < 0 || j >= S.themes.length) return;
  S.themes.splice(i, 1); S.themes.splice(j, 0, t); persist(); drawSide(); drawThemeEditor();

async function resetTheme(t) {
  if (!await ask({ title: 'Alapok visszaállítása', text: 'A(z) „' + t.name + '” téma minden kockáját és opcióját visszaállítom az eredetire. A saját módosításaid elvesznek ebben a témában.', ok: 'Visszaállítom', danger: true })) return;

  const i = S.themes.indexOf(t); S.themes[i] = seed; delete RT[t.id]; delete S.rolls[t.id]; persist(); drawSide(); drawThemeEditor(); toast('Visszaállítva');
}
function deleteTheme(t) {
  if (S.themes.length < 2) return;
  const i = S.themes.indexOf(t), saved = RT[t.id];
  S.themes.splice(i, 1); delete RT[t.id];
  if (S.ui.themeId === t.id) S.ui.themeId = S.themes[0].id;

  persist(); drawSide(); drawThemeEditor();
  toastAction('Törölve: ' + t.name, 'Visszavonás', () => { S.themes.splice(i, 0, t); if (saved) RT[t.id] = saved; E.tid = t.id; persist(); drawSide(); drawThemeEditor(); });
}

}

  t.dice.splice(i, 1); t.dice.splice(j, 0, d); persist(); drawThemeEditor();
}

    if (e.key === 'Enter') { e.preventDefault(); const i = d.options.indexOf(o); const n = Engine.parseLine(''); n.t = ''; d.options.splice(i + 1, 0, n); E.focus = n.id + ':t'; persist(); drawThemeEditor(); }

  });

  const tBtn = h('button', { type: 'button', class: 'ibtn sm tagbtn' + (advOpen ? ' on' : ''), title: 'Címkék és kapcsolatok szerkesztése', 'aria-expanded': advOpen ? 'true' : 'false', onclick: () => { E.adv[o.id] = !E.adv[o.id]; const nr = optRow(t, d, o, refill); row.replaceWith(nr); } },
    ic('tag', 17), nTags ? h('span', { class: 'badge' }, String(nTags)) : null);
  const del = iconBtn('trash', 'Opció törlése', () => { const i = d.options.indexOf(o); d.options.splice(i, 1); persist(); refill(); toastAction('Opció törölve', 'Visszavonás', () => { d.options.splice(i, 0, o); persist(); drawThemeEditor(); }); }, 'sm danger');
  row.appendChild(h('div', { class: 'orow-main' }, txt, sBtn, tBtn, del));

}

function genreDice() { const out = []; S.themes.forEach(t => { if (!t.dice.some(d => d.kind === 'shelf')) return; const g = t.dice.find(d => d.role === 'genre'); if (g) out.push(g); }); return out; }

function parseCSV(text, delim) {
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];

    else cur += c;
  }

}
const HDR = {

  genre: ['genre', 'genres', 'mufaj', 'kategoria', 'bookshelves', 'shelves', 'tags', 'cimkek'], mood: ['mood', 'hangulat'],
  pages: ['pages', 'oldal', 'oldalszam', 'number-of-pages', 'page-count', 'pagecount', 'oldalak'], status: ['status', 'statusz', 'allapot', 'exclusive-shelf', 'read-status', 'reading-status'],
  note: ['note', 'notes', 'megjegyzes', 'jegyzet', 'my-review', 'review']

  if (/^(currently-reading|olvasom|olvasas-alatt|reading|folyamatban|in-progress)$/.test(s)) return 'olvasom';

}
function cleanTitle(t) { return String(t || '').replace(/\s+\([^)]*#\d+[^)]*\)\s*$/, '').trim(); }  // "Dűne (Dune Chronicles #1)" → "Dűne"
function recToBook(r) {

function parseBooksText(raw) {

  if (!text) return out;

          if (typeof x === 'string') { const p = parseLineBook(x); if (p) out.books.push(p); return; }
          const r = {}; Object.keys(x || {}).forEach(k => { const sk = Engine.slug(k); for (const f in HDR) if (HDR[f].indexOf(sk) >= 0 && r[f] == null) r[f] = Array.isArray(x[k]) ? x[k].join(', ') : x[k]; });
          const b = recToBook(r); if (b) out.books.push(b);
        });
        return out;
      }
    } catch (e) { out.warnings.push('A JSON hibás, sorokként próbálom értelmezni.'); }
  }
  // CSV (fejléc alapján)
  const first = text.split(/\r?\n/)[0];
  const delim = [',', ';', '\t'].map(d => [d, (first.match(new RegExp(d === '\t' ? '\\t' : '\\' + d, 'g')) || []).length]).sort((a, b) => b[1] - a[1])[0];
  if (delim[1] >= 1) {
    const rows = parseCSV(text, delim[0]);
    const head = rows[0].map(c => Engine.slug(c));
    const idx = {}; for (const f in HDR) { const i = head.findIndex(c => HDR[f].indexOf(c) >= 0); if (i >= 0) idx[f] = i; }
    if (idx.title != null) {
      out.format = head.indexOf('exclusive-shelf') >= 0 ? 'Goodreads CSV' : 'CSV';

    }

  if (out.books.length === 1 && !/[-–;\t]/.test(text)) out.warnings.push('Egyetlen sort láttam. Soronként egy könyvet írj: „Cím – Szerző”.');

}

function isTyping(e) { const t = e.target; return !!t && (t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable || (t.tagName === 'INPUT' && /^(text|search|number|url|email|tel|password)$/.test(t.type || 'text'))); }

document.addEventListener('click', e => { if (e.detail > 0 && e.target.closest && e.target.closest('.switch') && document.activeElement && document.activeElement.type === 'checkbox') document.activeElement.blur(); });

  if (e.key === 'Escape' && MODALS.length) { MODALS[MODALS.length - 1].esc(); return; }
  if (MODALS.length || isTyping(e) || e.ctrlKey || e.metaKey || e.altKey) return;
