<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Kockázzunk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Josefin+Sans:wght@500;600;700&family=Marcellus&display=swap">
<style>
/* Elrendezés: fejléc + fő nézet (közép, max 1120px) + telefonon alsó fül-sáv. Hangulat: gyertyafényes esti asztal, krém fatábla, fa kockák. */
:root {
  --bg: #f8eee6; --bg2: #f1e2d7; --surface: #fffaf5; --surface2: #f6e9de; --raise: #ffffff;
  --line: rgba(90, 45, 40, .14); --line2: rgba(90, 45, 40, .28);
  --fg: #2a1a1d; --fg2: #66504f; --fg3: #8f7776;
  --heart: #d23f58; --on-accent: #ffffff;
  --board: #fffcf6; --board2: #f4e8d4; --boardink: #a67c40; --boardline: rgba(120, 80, 30, .24);
  --wood1: #efd5a9; --wood2: #d8ad72; --woodink: #4b2d15;
  --glow: rgba(255, 176, 96, .30);
  --bokeh1: rgba(255, 170, 120, .34); --bokeh2: rgba(236, 110, 140, .26); --bokeh3: rgba(255, 214, 140, .38);
  --shadow: 0 10px 30px rgba(90, 35, 35, .16); --shadow-s: 0 2px 8px rgba(90, 35, 35, .12);
  --ok: #2c8a58; --warn: #a96d14; --danger: #c52f48;
  --f-ui: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  --f-display: 'Marcellus', 'Palatino Linotype', 'Book Antiqua', Georgia, serif;
  --f-cube: 'Josefin Sans', 'Trebuchet MS', 'Gill Sans', sans-serif;
  --tc: var(--heart);
  --gut: max(16px, env(safe-area-inset-left, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #150e14; --bg2: #1d121b; --surface: #251925; --surface2: #2f202e; --raise: #38283a;
    --line: rgba(255, 225, 205, .11); --line2: rgba(255, 225, 205, .24);
    --fg: #f8ede5; --fg2: #cfbab3; --fg3: #927d7c;
    --heart: #ee647c;
    --board: #f4e9d6; --board2: #e6d4b4; --boardink: #9d7238; --boardline: rgba(110, 70, 20, .3);
    --glow: rgba(255, 170, 90, .26);
    --bokeh1: rgba(255, 150, 90, .20); --bokeh2: rgba(220, 70, 120, .22); --bokeh3: rgba(255, 200, 120, .16);
    --shadow: 0 14px 36px rgba(0, 0, 0, .5); --shadow-s: 0 2px 10px rgba(0, 0, 0, .4);
    --ok: #52c488; --warn: #e3a550; --danger: #ff6b82;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #150e14; --bg2: #1d121b; --surface: #251925; --surface2: #2f202e; --raise: #38283a;
  --line: rgba(255, 225, 205, .11); --line2: rgba(255, 225, 205, .24);
  --fg: #f8ede5; --fg2: #cfbab3; --fg3: #927d7c;
  --heart: #ee647c;
  --board: #f4e9d6; --board2: #e6d4b4; --boardink: #9d7238; --boardline: rgba(110, 70, 20, .3);
  --glow: rgba(255, 170, 90, .26);
  --bokeh1: rgba(255, 150, 90, .20); --bokeh2: rgba(220, 70, 120, .22); --bokeh3: rgba(255, 200, 120, .16);
  --shadow: 0 14px 36px rgba(0, 0, 0, .5); --shadow-s: 0 2px 10px rgba(0, 0, 0, .4);
  --ok: #52c488; --warn: #e3a550; --danger: #ff6b82;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
html.modal-open { overflow: hidden; }
body {
  background: var(--bg); color: var(--fg);
  font: 400 1rem/1.5 var(--f-ui);
  min-height: 100%; overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--bg); }
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 400; margin: 0; line-height: 1.2; text-wrap: balance; letter-spacing: .01em; }
p { margin: 0; }
button { font: inherit; color: inherit; }
a { color: var(--tc); }
:focus-visible { outline: 2px solid var(--tc); outline-offset: 2px; border-radius: 6px; }
.muted { color: var(--fg2); }
.small { font-size: .875rem; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { display: inline-flex; flex: none; line-height: 0; }

/* ---------- háttér: bokeh gyertyafény (statikus: nincs blur, nincs animáció, egyszer rajzolódik) ---------- */
#bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; contain: strict; }
#bg i { position: absolute; border-radius: 50%; }
#bg i:nth-child(1) { width: 44vmax; height: 44vmax; left: -12vmax; top: -10vmax; background: radial-gradient(circle, var(--bokeh2), transparent 66%); }
#bg i:nth-child(2) { width: 36vmax; height: 36vmax; right: -10vmax; top: 4vmax; background: radial-gradient(circle, var(--bokeh1), transparent 66%); }
#bg i:nth-child(3) { width: 28vmax; height: 28vmax; left: 28%; bottom: -10vmax; background: radial-gradient(circle, var(--bokeh3), transparent 66%); }
#bg i:nth-child(4) { width: 7vmax; height: 7vmax; left: 12%; top: 38%; background: radial-gradient(circle, var(--bokeh3), transparent 70%); }
#bg i:nth-child(5) { width: 5vmax; height: 5vmax; right: 18%; top: 54%; background: radial-gradient(circle, var(--bokeh1), transparent 70%); }
#bg i:nth-child(6) { width: 9vmax; height: 9vmax; right: 34%; top: 12%; background: radial-gradient(circle, var(--bokeh3), transparent 70%); }
#bg i:nth-child(7) { width: 6vmax; height: 6vmax; left: 52%; top: 66%; background: radial-gradient(circle, var(--bokeh2), transparent 70%); }
.lite #bg { display: none; }

#app { position: relative; z-index: 1; padding-left: var(--gut); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 28px; min-height: 100vh; }
#app > * { max-width: 1120px; margin-inline: auto; width: 100%; }

/* ---------- fejléc + navigáció ---------- */
#top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; display: flex; align-items: center; gap: 12px; padding-block: 10px; }
#top::before { content: ""; position: absolute; z-index: -1; top: 0; bottom: 0; left: calc(50% - 50vw); right: calc(50% - 50vw); background: color-mix(in srgb, var(--bg) 90%, transparent); border-bottom: 1px solid transparent; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--fg); border: 0; background: none; padding: 4px; cursor: pointer; border-radius: 12px; }
.brand-mark { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(145deg, var(--wood1), var(--wood2)); box-shadow: inset 0 0 0 1.5px rgba(255, 245, 220, .5), 0 3px 8px rgba(80, 40, 10, .3); display: grid; place-items: center; color: var(--heart); transform: rotate(-8deg); transition: transform .3s; }
.brand:hover .brand-mark { transform: rotate(6deg) scale(1.06); }
.brand-name { font-family: var(--f-display); font-size: 1.45rem; letter-spacing: .02em; }
.nav { display: flex; gap: 4px; margin-left: auto; }
.nav a { display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 999px; text-decoration: none; color: var(--fg2); font-weight: 600; font-size: .94rem; transition: background .2s, color .2s; }
.nav a:hover { background: var(--surface2); color: var(--fg); }
.nav a[aria-current="page"] { background: color-mix(in srgb, var(--tc) 16%, transparent); color: var(--fg); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--tc) 40%, transparent); }
.nav a[aria-current="page"] .ic { color: var(--tc); }
#top .tools { display: flex; gap: 4px; }
#tabs { display: none; }

@media (max-width: 800px) {
  .nav { display: none; }
  #top { justify-content: space-between; }
  #top .tools { margin-left: auto; }
  #tabs { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); background: color-mix(in srgb, var(--surface) 97%, transparent); border-top: 1px solid var(--line); max-width: none; justify-content: space-around; }
  #tabs a { display: flex; flex-direction: column; align-items: center; gap: 2px; flex: 1; padding: 6px 2px; border-radius: 12px; text-decoration: none; color: var(--fg2); font-size: .7rem; font-weight: 600; min-width: 0; }
  #tabs a[aria-current="page"] { color: var(--fg); background: color-mix(in srgb, var(--tc) 14%, transparent); }
  #tabs a[aria-current="page"] .ic { color: var(--tc); }
  #app { padding-bottom: 96px; }
}
@media (max-width: 420px) { .brand-name { font-size: 1.25rem; } }

/* ---------- gombok ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 9px 16px; border-radius: 12px; border: 1px solid var(--line2); background: var(--surface2); color: var(--fg); font-weight: 600; font-size: .94rem; cursor: pointer; transition: transform .15s, box-shadow .2s, background .2s, border-color .2s; text-decoration: none; }
.btn:hover { background: var(--raise); transform: translateY(-1px); box-shadow: var(--shadow-s); }
.btn:active { transform: translateY(0) scale(.98); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn.primary { background: linear-gradient(180deg, color-mix(in srgb, var(--tc) 88%, #fff), var(--tc)); border-color: color-mix(in srgb, var(--tc) 70%, #000); color: var(--on-accent); box-shadow: 0 4px 14px color-mix(in srgb, var(--tc) 40%, transparent), inset 0 1px 0 rgba(255, 255, 255, .3); text-shadow: 0 1px 1px rgba(0, 0, 0, .18); }
.btn.primary:hover { box-shadow: 0 6px 20px color-mix(in srgb, var(--tc) 50%, transparent), inset 0 1px 0 rgba(255, 255, 255, .3); background: linear-gradient(180deg, color-mix(in srgb, var(--tc) 80%, #fff), color-mix(in srgb, var(--tc) 92%, #000)); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--fg2); }
.btn.ghost:hover { background: var(--surface2); color: var(--fg); box-shadow: none; }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, transparent); background: transparent; }
.btn.danger:hover { background: color-mix(in srgb, var(--danger) 12%, transparent); }
.btn.danger.solid { background: var(--danger); color: #fff; border-color: transparent; }
.btn.sm { min-height: 34px; padding: 5px 11px; font-size: .85rem; border-radius: 10px; }
.btn.lg { min-height: 54px; padding: 12px 30px; font-size: 1.1rem; border-radius: 16px; }
.ibtn { display: inline-grid; place-items: center; width: 38px; height: 38px; flex: none; border-radius: 12px; border: 1px solid transparent; background: transparent; color: var(--fg2); cursor: pointer; transition: background .2s, color .2s, transform .15s; }
.ibtn:hover { background: var(--surface2); color: var(--fg); }
.ibtn:active { transform: scale(.92); }
.ibtn.on { color: var(--tc); background: color-mix(in srgb, var(--tc) 14%, transparent); }
.ibtn.sm { width: 32px; height: 32px; border-radius: 10px; }
.ibtn.danger:hover { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }
.ibtn[disabled] { opacity: .3; pointer-events: none; }

/* ---------- űrlap ---------- */
input[type=text], input[type=search], input[type=number], input[type=url], select, textarea {
  width: 100%; min-height: 42px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line2); background: var(--surface); color: var(--fg);
  font: inherit; font-size: .96rem; transition: border-color .2s, box-shadow .2s;
}
textarea { min-height: 90px; resize: vertical; line-height: 1.45; }
input::placeholder, textarea::placeholder { color: var(--fg3); }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--tc); box-shadow: 0 0 0 3px color-mix(in srgb, var(--tc) 24%, transparent); }
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--fg2) 50%), linear-gradient(135deg, var(--fg2) 50%, transparent 50%); background-position: calc(100% - 18px) 52%, calc(100% - 13px) 52%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 34px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .lbl { font-size: .8rem; font-weight: 700; color: var(--fg2); letter-spacing: .04em; text-transform: uppercase; }
.field .hint { font-size: .8rem; color: var(--fg3); }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
.codebox { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: .8rem; line-height: 1.5; word-break: break-all; }
input[type=range] { width: 100%; accent-color: var(--tc); min-height: 28px; }
input[type=checkbox], input[type=radio] { accent-color: var(--tc); width: 18px; height: 18px; }

.switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 600; user-select: none; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch .tr { position: relative; width: 44px; height: 26px; border-radius: 999px; background: var(--line2); transition: background .25s; flex: none; }
.switch .tr::after { content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .35); transition: transform .25s cubic-bezier(.3, 1.4, .5, 1); }
.switch input:checked + .tr { background: var(--tc); }
.switch input:checked + .tr::after { transform: translateX(18px); }
.switch input:focus-visible + .tr { outline: 2px solid var(--tc); outline-offset: 2px; }

.chip { display: inline-flex; align-items: center; gap: 7px; min-height: 38px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line2); background: var(--surface); color: var(--fg2); font-weight: 600; font-size: .92rem; cursor: pointer; white-space: nowrap; transition: all .2s; }
.chip:hover { color: var(--fg); background: var(--raise); }
.chip.on { background: color-mix(in srgb, var(--tc) 18%, var(--surface)); color: var(--fg); border-color: var(--tc); box-shadow: 0 0 0 1px color-mix(in srgb, var(--tc) 40%, transparent); }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: .74rem; font-weight: 700; background: var(--surface2); color: var(--fg2); letter-spacing: .02em; border: 1px solid var(--line); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; box-shadow: var(--shadow-s); }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.spacer { flex: 1; }

/* ---------- modal ---------- */
.modal-back { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) var(--gut) max(16px, env(safe-area-inset-bottom, 0px)); background: rgba(14, 5, 12, .68); animation: fadein .18s ease both; }
.modal-back.out { animation: fadeout .17s ease both; }
.modal { width: 100%; max-width: 560px; max-height: min(90vh, 900px); display: flex; flex-direction: column; background: var(--surface); color: var(--fg); border: 1px solid var(--line2); border-radius: 22px; box-shadow: 0 30px 80px rgba(0, 0, 0, .45); animation: popin .24s cubic-bezier(.2, 1.1, .4, 1) both; overflow: hidden; }
.modal.small { max-width: 420px; }
.modal.wide { max-width: 860px; }
.modal-back.out .modal { animation: popout .17s ease both; }
.modal-head { display: flex; align-items: center; gap: 10px; padding: 16px 16px 6px 22px; }
.modal-head h2 { flex: 1; font-size: 1.4rem; }
.modal-body { padding: 8px 22px 18px; overflow: auto; display: flex; flex-direction: column; gap: 14px; overscroll-behavior: contain; }
.modal-foot { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 10px; padding: 12px 22px 16px; border-top: 1px solid var(--line); background: var(--surface); }
.ask-text { color: var(--fg2); }
@keyframes fadein { from { opacity: 0; } }
@keyframes fadeout { to { opacity: 0; } }
@keyframes popin { from { opacity: 0; transform: translateY(14px) scale(.96); } }
@keyframes popout { to { opacity: 0; transform: translateY(8px) scale(.97); } }
@media (max-width: 560px) {
  .modal-back { place-items: end center; padding: 0; }
  .modal, .modal.small, .modal.wide { max-width: none; border-radius: 22px 22px 0 0; max-height: 92vh; padding-bottom: env(safe-area-inset-bottom, 0px); animation-name: sheetin; }
  .modal-back.out .modal { animation-name: sheetout; }
  .modal-head h2 { font-size: 1.25rem; }
}
@keyframes sheetin { from { transform: translateY(40px); opacity: 0; } }
@keyframes sheetout { to { transform: translateY(30px); opacity: 0; } }

/* ---------- toast ---------- */
#toasts { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 120; display: flex; flex-direction: column; align-items: center; gap: 8px; width: min(92vw, 460px); pointer-events: none; }
.toast { background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 14px; font-weight: 600; font-size: .92rem; box-shadow: var(--shadow); animation: toastin .3s cubic-bezier(.2, 1.2, .4, 1) both; text-align: center; }
.toast.out { animation: toastout .25s ease both; }
@keyframes toastin { from { opacity: 0; transform: translateY(14px) scale(.95); } }
@keyframes toastout { to { opacity: 0; transform: translateY(8px); } }
@media (max-width: 800px) { #toasts { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); } }

#fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 90; pointer-events: none; }

/* ---------- nézetváltás ---------- */
.view-in { animation: viewin .4s cubic-bezier(.2, .9, .3, 1) both; }
@keyframes viewin { from { opacity: 0; transform: translateY(12px); } }
.page-title { display: flex; flex-wrap: wrap; align-items: end; gap: 6px 16px; margin: 10px 0 18px; }
.page-title h1 { font-size: clamp(1.7rem, 4.5vw, 2.4rem); }
.page-title p { color: var(--fg2); max-width: 60ch; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
}
.no-motion *, .no-motion *::before, .no-motion *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
/* Kímélő mód: gyengébb gépen is sima. Nincs háttér-izzás, nincs belépő animáció, nincsenek nagy árnyékok. */
.lite .view-in, .lite .slot, .lite .rrow, .lite .toast { animation: none !important; }
.lite .board { box-shadow: 0 1px 0 rgba(255, 255, 255, .9) inset, 0 6px 0 -1px var(--wood2); }
.lite .btn, .lite .chip, .lite .ibtn { transition: none; }
.lite .btn:hover { transform: none; box-shadow: none; }
.lite .modal { box-shadow: none; }


/* ===== Dobás nézet ===== */
.play { display: flex; flex-direction: column; gap: 18px; padding-top: 6px; }

.themebar { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px; margin-inline: -2px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.themebar::-webkit-scrollbar { display: none; }
.theme-chip .ce { font-size: 1.15rem; line-height: 1; }
.theme-chip.on { background: color-mix(in srgb, var(--tc) 22%, var(--surface)); border-color: var(--tc); }
.add-chip { border-style: dashed; background: transparent; }

.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.chaos { display: flex; align-items: center; gap: 10px; width: 180px; animation: fadein .3s both; }
.chaos[hidden] { display: none; }

/* ---------- a tábla ---------- */
.board {
  --s: clamp(100px, 10.5vw, 124px); --c: calc(var(--s) * .86);
  position: relative; padding: 24px 16px 28px; border-radius: 28px;
  background: radial-gradient(120% 90% at 50% 0%, #fffdf8, var(--board) 52%, var(--board2));
  border: 1px solid rgba(160, 110, 50, .38);
  box-shadow: 0 1px 0 rgba(255, 255, 255, .95) inset, 0 7px 0 -1px var(--wood2), 0 8px 0 -1px rgba(90, 50, 10, .45), var(--shadow), 0 0 90px var(--glow);
  margin-bottom: 8px;
}
.board::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: repeating-linear-gradient(90deg, rgba(150, 100, 40, .035) 0 2px, transparent 2px 9px); }
.board-title { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 4px 16px; text-align: center; font-family: var(--f-display); text-transform: uppercase; letter-spacing: .2em; font-size: clamp(1.05rem, 3.6vw, 1.85rem); color: var(--boardink); text-shadow: 0 1px 0 rgba(255, 255, 255, .85), 0 -1px 0 rgba(120, 80, 30, .25); }
.bt-theme { color: color-mix(in srgb, var(--tc) 68%, #6a4a20); }
.board-desc { text-align: center; margin: 8px auto 4px; max-width: 56ch; font-size: .88rem; letter-spacing: .03em; color: var(--boardink); text-shadow: 0 1px 0 rgba(255, 255, 255, .7); }
.heart-piece { border: 0; background: none; padding: 2px; cursor: pointer; filter: drop-shadow(0 3px 2px rgba(80, 20, 20, .4)); transform: rotate(-6deg); transition: transform .25s cubic-bezier(.3, 1.6, .5, 1); line-height: 0; }
.heart-piece:hover { transform: rotate(5deg) scale(1.14); }

.slots { display: flex; flex-wrap: wrap; justify-content: center; gap: 26px 12px; margin-top: 22px; position: relative; z-index: 1; }
.slot { position: relative; width: calc(var(--s) + 26px); display: flex; flex-direction: column; align-items: center; gap: 12px; animation: slotin .55s cubic-bezier(.2, 1.2, .4, 1) both; animation-delay: calc(var(--i) * 55ms); }
@keyframes slotin { from { opacity: 0; transform: translateY(-28px) scale(.9); } }

.stage { position: relative; width: calc(var(--s) + 18px); height: calc(var(--s) + 12px); display: grid; place-items: center; perspective: 760px; cursor: pointer; border-radius: 12px; -webkit-user-select: none; user-select: none; }
.stage::before { content: ""; position: absolute; inset: 0; border-radius: 12px; background: linear-gradient(160deg, #e6d1a8, #f3e5c6); box-shadow: inset 0 3px 9px rgba(90, 55, 15, .42), inset 0 -1px 0 rgba(255, 255, 255, .75), 0 1px 0 rgba(255, 255, 255, .85); transition: box-shadow .3s; }
.slot.locked .stage::before { box-shadow: inset 0 3px 9px rgba(90, 55, 15, .42), 0 0 0 2px #e0a62f, 0 0 24px rgba(255, 186, 60, .65); }
.cshadow { position: absolute; left: 12%; bottom: 7px; width: 76%; height: 14px; background: radial-gradient(ellipse at center, rgba(60, 30, 5, .6), transparent 70%); opacity: .6; pointer-events: none; }
.toss { position: relative; width: var(--c); height: var(--c); transform-style: preserve-3d; transition: transform .22s; }
.stage:hover .toss { transform: translateY(-3px); }
.stage:active .toss { transform: translateY(1px) scale(.97); }
.tilt { width: 100%; height: 100%; transform-style: preserve-3d; transform: rotateX(-14deg) rotateY(-18deg); }
.cube { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transform: rotateX(0deg) rotateY(0deg); will-change: transform; }
.face { position: absolute; inset: 0; display: grid; place-items: center; padding: calc(var(--c) * .08); border-radius: calc(var(--c) * .06); backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background: repeating-linear-gradient(94deg, rgba(120, 70, 20, .08) 0 1px, transparent 1px 6px), radial-gradient(120% 120% at 25% 15%, var(--wood1), var(--wood2));
  box-shadow: inset 0 0 0 1.5px rgba(255, 246, 220, .4), inset 0 0 calc(var(--c) * .16) rgba(110, 60, 15, .38); }
.face::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: #2a1406; opacity: var(--dk, 0); transition: opacity var(--dur, 0ms) ease-out; pointer-events: none; }
.fc0 { transform: translateZ(calc(var(--c) / 2)); }
.fc1 { transform: rotateY(180deg) translateZ(calc(var(--c) / 2)); }
.fc2 { transform: rotateY(90deg) translateZ(calc(var(--c) / 2)); }
.fc3 { transform: rotateY(-90deg) translateZ(calc(var(--c) / 2)); }
.fc4 { transform: rotateX(90deg) translateZ(calc(var(--c) / 2)); }
.fc5 { transform: rotateX(-90deg) translateZ(calc(var(--c) / 2)); }
.ft { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 6; overflow: hidden; max-width: 100%; text-align: center; font-family: var(--f-cube); font-weight: 700; text-transform: uppercase; letter-spacing: .045em; line-height: 1.16; color: var(--woodink); text-shadow: 0 1px 0 rgba(255, 238, 205, .65), 0 -1px 0 rgba(70, 35, 10, .2); overflow-wrap: anywhere; hyphens: auto; -webkit-hyphens: auto; }
.f1 { font-size: max(12.5px, calc(var(--c) * .15)); }
.f2 { font-size: max(10.5px, calc(var(--c) * .125)); }
.f3 { font-size: max(9px, calc(var(--c) * .106)); }
.f4 { font-size: max(8.2px, calc(var(--c) * .092)); }
.f5 { font-size: max(7.6px, calc(var(--c) * .082)); letter-spacing: .02em; }

.lockbtn { position: absolute; top: -9px; right: -2px; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; border: 1px solid var(--boardline); background: var(--board); color: var(--boardink); box-shadow: 0 2px 6px rgba(80, 40, 10, .3); transition: background .2s, color .2s, transform .2s; z-index: 3; }
.lockbtn::after { content: ""; position: absolute; inset: -6px; }
.lockbtn:hover { transform: scale(1.1); color: var(--woodink); }
.slot.locked .lockbtn { background: #e0a62f; color: #3d2208; border-color: #b9821a; box-shadow: 0 0 14px rgba(255, 186, 60, .8), 0 2px 6px rgba(80, 40, 10, .3); }
.sflag { position: absolute; top: -9px; left: -2px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; z-index: 3; box-shadow: 0 2px 6px rgba(80, 40, 10, .3); animation: popin .3s both; }
.sflag[hidden] { display: none; }
.sflag.s { background: #8d5fd6; color: #fff; }
.sflag.c { background: #e8a23c; color: #3d2208; }
.slot-label { display: flex; align-items: baseline; justify-content: center; gap: 6px; max-width: 100%; text-align: center; font-family: var(--f-display); text-transform: uppercase; letter-spacing: .11em; font-size: .78rem; line-height: 1.25; color: var(--boardink); text-shadow: 0 1px 0 rgba(255, 255, 255, .8); }
.slot-label .num { flex: none; font-family: var(--f-ui); font-size: .62rem; letter-spacing: 0; padding: 0 4px; border: 1px solid var(--boardline); border-radius: 5px; opacity: .8; }
.empty-board { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 28px 12px; color: var(--boardink); text-align: center; }

/* ---------- gombsor + eredmények ---------- */
.rollbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 14px 18px; }
.rollbar-sec { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.roll-btn { min-width: 210px; }
.roll-btn .ic svg { transition: transform .5s cubic-bezier(.3, 1.4, .5, 1); }
.roll-btn:hover .ic svg { transform: rotate(180deg); }
.btn.faved { color: var(--tc); border-color: var(--tc); background: color-mix(in srgb, var(--tc) 14%, var(--surface2)); }
.btn.faved .ic svg { fill: currentColor; }

.result-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 14px; margin: 8px 0 12px; }
.result-head h2 { font-size: 1.5rem; }
.rows { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 12px; }
.rrow { position: relative; display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 4px 14px; align-items: start; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-s); animation: rowin .5s cubic-bezier(.2, 1, .3, 1) both; animation-delay: calc(var(--i) * 45ms); transition: border-color .3s, box-shadow .3s; }
@keyframes rowin { from { opacity: 0; transform: translateY(12px); } }
.rrow.locked { border-color: color-mix(in srgb, #e0a62f 70%, transparent); box-shadow: var(--shadow-s), 0 0 0 1px color-mix(in srgb, #e0a62f 40%, transparent); }
.rrow.pop { animation: rpop .5s cubic-bezier(.2, 1.3, .4, 1); }
.rrow.pop::after { content: ""; position: absolute; inset: 0; border-radius: inherit; border: 2px solid var(--tc); pointer-events: none; animation: ring .6s ease-out both; }
@keyframes rpop { 0% { transform: scale(.97); } 55% { transform: scale(1.012); } 100% { transform: scale(1); } }
@keyframes ring { from { opacity: .75; transform: scale(1); } to { opacity: 0; transform: scale(1.03, 1.1); } }
.ricon { width: 46px; height: 46px; display: grid; place-items: center; font-size: 1.5rem; border-radius: 13px; background: color-mix(in srgb, var(--tc) 13%, var(--surface2)); }
.rmain { min-width: 0; display: flex; flex-direction: column; gap: 3px; padding-top: 1px; }
.rlabel { font-size: .7rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--fg3); }
.rtext { font-size: 1.08rem; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; min-height: 1.3em; }
.rmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: .86rem; }
.rmeta:empty, .rflags:empty { display: none; }
.rflags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.flag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px 2px 7px; border-radius: 999px; font-size: .74rem; font-weight: 700; }
.flag.s { background: color-mix(in srgb, #9b6bdb 20%, transparent); color: color-mix(in srgb, #8d5fd6 80%, var(--fg)); }
.flag.c { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.ractions { display: flex; gap: 2px; margin: -4px -6px 0 0; }
@media (hover: hover) {
  .ractions .ibtn:not(.on) { opacity: 0; transition: opacity .2s; }
  .rrow:hover .ractions .ibtn, .rrow:focus-within .ractions .ibtn { opacity: 1; }
}
.rrow.rolling .rtext { width: min(72%, 220px); border-radius: 8px; color: transparent; background: var(--surface2); animation: skel .8s ease-in-out infinite alternate; }
@keyframes skel { from { opacity: .35; } to { opacity: 1; } }
.hint { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 6px; text-align: center; color: var(--fg2); font-size: .86rem; margin-top: 4px; }
.hint .ic { color: var(--tc); }

.picklist { display: flex; flex-direction: column; gap: 6px; }
.pickitem { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface2); cursor: pointer; font-weight: 500; transition: background .15s, border-color .15s; }
.pickitem:hover { background: var(--raise); border-color: var(--line2); }

@media (max-width: 800px) {
  .toolbar { gap: 8px 12px; }
  .toolbar .hide-sm { display: none; }
  .board { --s: clamp(76px, 20.5vw, 120px); padding: 20px 12px 24px; border-radius: 24px; }
  .slot { width: calc(var(--s) + 20px); }
  .stage { width: calc(var(--s) + 14px); height: calc(var(--s) + 8px); }
  .slots { gap: 22px 8px; }
  .slot-label { font-size: .68rem; letter-spacing: .08em; }
  .roll-btn { width: 100%; }
  .rrow { grid-template-columns: 42px minmax(0, 1fr) auto; padding: 12px; gap: 4px 12px; }
  .ricon { width: 42px; height: 42px; }
}

:root { --lh: 214px; }
.lb-tabs { margin: -6px 0 14px; }
.lb-shelves { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 500px), 1fr)); gap: 22px 20px; align-items: start; }
.lb-case { min-width: 0; }
.lb-case.wide { grid-column: 1 / -1; }
.chip.sm { min-height: 30px; padding: 3px 11px; font-size: .82rem; gap: 5px; }
.lb { display: flex; flex-direction: column; gap: 14px; }
.lb-bar { display: flex; flex-direction: column; gap: 10px; }
.lb-count { white-space: nowrap; }
.btn.on { background: color-mix(in srgb, var(--tc) 18%, var(--surface)); border-color: var(--tc); }
.lb-hint { margin: -2px 0 2px; max-width: 78ch; }
.lb-picked { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; padding: 10px 14px; border-radius: 14px; background: color-mix(in srgb, var(--heart) 10%, var(--surface)); border: 1px solid color-mix(in srgb, var(--heart) 30%, var(--line)); }
.lb-picked .ic { color: var(--heart); }
.lb-picked .grow { flex: 1 1 220px; min-width: 0; }

/* könyvszekrény */
.lb-case { --w1: #b0794a; --w2: #84522d; --w3: #5b3820; --back: #2f1e15; display: flex; flex-direction: column; gap: 6px; }
.lb-head { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 12px; padding: 0 4px; }
.lb-head h2 { font-size: 1.3rem; }
.lb-name { font-family: var(--f-display); font-size: 1.15rem; max-width: 100%; width: min(320px, 100%); padding: 5px 10px; }
.lb-frame { padding: 12px 12px 10px; border-radius: 12px 12px 6px 6px; background: linear-gradient(90deg, var(--w2), var(--w1) 3%, var(--w2) 5%, var(--w2) 95%, var(--w1) 97%, var(--w2)); box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 235, 200, .35); }
.lb-row {
  display: flex; flex-wrap: wrap; align-content: flex-start; min-height: var(--lh); padding: 0 8px; position: relative;
  background:
    repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--lh) - 14px), var(--w1) calc(var(--lh) - 14px), var(--w2) calc(var(--lh) - 12px), var(--w3) calc(var(--lh) - 3px), #2b180c calc(var(--lh) - 3px), #2b180c var(--lh)),
    repeating-linear-gradient(90deg, rgba(255, 255, 255, .025) 0 2px, transparent 2px 9px),
    var(--back);
  box-shadow: inset 0 10px 14px -6px rgba(0, 0, 0, .65), inset 10px 0 12px -8px rgba(0, 0, 0, .6), inset -10px 0 12px -8px rgba(0, 0, 0, .6);
}
.lb-empty { align-self: center; padding: 0 12px; color: #d9c3a0; }
.lb-slot { flex: none; display: flex; align-items: flex-end; justify-content: center; width: calc(var(--w) + 2px); height: var(--lh); padding: 0 1px 14px; }
.lb-sp { position: relative; flex: none; width: var(--w); height: calc(var(--k) * (var(--lh) - 40px)); padding: 0; margin: 0; border: 0; background: none; cursor: pointer; font: inherit; color: var(--ink); -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
.lb-sp:focus-visible { outline: none; }
.lb-sp:focus-visible .lb-bk { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--tc); }
.lb-bk {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 18px 0 14px; border-radius: 2px 2px 1px 1px; transform-origin: 18% 100%;
  background: linear-gradient(90deg, rgba(0, 0, 0, .32), rgba(255, 255, 255, .13) 10%, rgba(255, 255, 255, 0) 38%, rgba(0, 0, 0, .1) 84%, rgba(0, 0, 0, .34)), var(--c);
  box-shadow: 1px 0 0 rgba(0, 0, 0, .35), 0 1px 0 rgba(0, 0, 0, .25);
  transition: transform .24s cubic-bezier(.3, 1.5, .5, 1), box-shadow .2s;
}
.lb-bk::before, .lb-bk::after { content: ''; position: absolute; left: 0; right: 0; pointer-events: none; }
.lb-t { flex: 1 1 0; min-height: 0; max-height: 100%; writing-mode: vertical-rl; font-family: var(--f-display); font-size: var(--fs, 13px); line-height: 1.15; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: start; }
.lb-a { flex: 0 1 auto; max-height: var(--ah, 30%); writing-mode: vertical-rl; font-family: var(--f-ui); font-size: 10px; letter-spacing: .03em; opacity: .78; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* stílusok */
.s1 .lb-bk::before { top: 7px; height: 6px; border-top: 2px solid var(--ink); border-bottom: 2px solid var(--ink); opacity: .55; }
.s1 .lb-bk::after { bottom: 7px; height: 6px; border-top: 2px solid var(--ink); border-bottom: 2px solid var(--ink); opacity: .55; }
.s2 .lb-bk::before { top: 7px; height: 2px; background: #d9b25a; box-shadow: 0 4px 0 #d9b25a; }
.s2 .lb-bk::after { bottom: 7px; height: 2px; background: #d9b25a; box-shadow: 0 -4px 0 #d9b25a; }
.s2 .lb-t { color: #f3deaa; text-shadow: 0 1px 0 rgba(0, 0, 0, .35); }
.s3 .lb-t { background: color-mix(in srgb, var(--ink) 16%, transparent); padding: 6px 3px; border-radius: 2px; }
.s3 .lb-bk::after { bottom: 6px; left: 50%; right: auto; width: 9px; height: 9px; margin-left: -4.5px; background: var(--ink); opacity: .65; }
.s4 .lb-bk { background: linear-gradient(180deg, rgba(255, 255, 255, .16), rgba(255, 255, 255, 0) 12%, rgba(0, 0, 0, 0) 85%, rgba(0, 0, 0, .28)), linear-gradient(90deg, rgba(0, 0, 0, .32), rgba(255, 255, 255, .1) 10%, rgba(255, 255, 255, 0) 38%, rgba(0, 0, 0, .12) 84%, rgba(0, 0, 0, .36)), var(--c); }
.s4 .lb-bk::before { top: 0; bottom: 0; left: 24%; right: auto; width: 1px; background: rgba(0, 0, 0, .22); }
/* státusz */
.lb-mark { position: absolute; pointer-events: none; }
.reading .lb-mark { top: -7px; left: 50%; margin-left: -3px; width: 6px; height: 17px; background: #c43d4b; box-shadow: 0 1px 2px rgba(0, 0, 0, .4); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 80%, 0 100%); }
.done .lb-mark { bottom: 5px; left: 50%; margin-left: -4px; width: 8px; height: 8px; border-radius: 50%; background: #e8c765; box-shadow: 0 0 0 1px rgba(0, 0, 0, .3); }
.s3.done .lb-mark { bottom: 20px; }
/* billenés egérrávitelre / fókuszra */
@media (hover: hover) { .lb:not(.edit) .lb-sp:hover .lb-bk { transform: translateY(-4px) rotate(-6deg); box-shadow: 4px 7px 12px rgba(0, 0, 0, .5), 1px 0 0 rgba(0, 0, 0, .35); z-index: 3; } }
.lb:not(.edit) .lb-sp:focus-visible .lb-bk { transform: translateY(-4px) rotate(-6deg); }
.lb:not(.edit) .lb-sp:active .lb-bk { transform: translateY(-2px) rotate(-3deg); }
.lb.edit .lb-sp { cursor: grab; touch-action: none; }
.lb.edit .lb-sp:hover .lb-bk { transform: translateY(-3px); }
.lb-sp.picked .lb-bk { transform: translateY(-12px); box-shadow: 0 0 0 2px #f4d37a, 0 0 14px 2px rgba(244, 211, 122, .55), 3px 8px 12px rgba(0, 0, 0, .45); }
.lb-sp.picked::before { content: '♥'; position: absolute; top: -34px; left: 50%; transform: translateX(-50%); color: #ff7a90; font-size: 15px; line-height: 1; pointer-events: none; }
.lb-sp.flash .lb-bk { animation: lbflash .5s 3; }
@keyframes lbflash { 50% { transform: translateY(-20px) rotate(-8deg); } }
.lb-sp.dim .lb-bk { opacity: .22; filter: grayscale(.6); }
/* húzás */
.lb-src { width: 0 !important; padding: 0 !important; overflow: hidden; visibility: hidden; }
.lb-gap { background: rgba(255, 255, 255, .12); outline: 2px dashed rgba(244, 211, 122, .85); outline-offset: -3px; border-radius: 3px; animation: none; }
.lb-ghost { position: fixed; left: 0; top: 0; z-index: 90; pointer-events: none; will-change: transform; filter: drop-shadow(6px 10px 10px rgba(0, 0, 0, .5)); }
.lb-ghost .lb-sp { position: absolute; inset: 0; width: auto; height: auto; }
.dragging, .dragging * { cursor: grabbing !important; user-select: none !important; -webkit-user-select: none !important; }
/* részletek-ablak */
.lb-top { display: flex; gap: 18px; align-items: flex-end; }
.lb-prev { flex: none; padding: 10px 14px 0; border-radius: 10px; background: var(--back, #2f1e15); background: #2f1e15; border-bottom: 10px solid #84522d; }
.lb-prev .lb-slot { height: calc(var(--lh) - 14px); padding-bottom: 0; }
.lb-prev .lb-sp { pointer-events: none; }
.lb-info { min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.lb-info h3 { font-family: var(--f-ui); font-weight: 700; font-size: 1.15rem; overflow-wrap: anywhere; }
.lb-sec { display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; border-radius: 14px; background: var(--surface2); border: 1px solid var(--line); }
.lb-sec h4 { font-family: var(--f-ui); font-size: .8rem; font-weight: 700; color: var(--fg2); letter-spacing: .05em; text-transform: uppercase; }
.lb-opt { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.lb-opt .lbl { flex: 0 0 76px; font-size: .8rem; font-weight: 700; color: var(--fg2); }
.lb-opt > .row, .lb-sws { flex: 1 1 200px; min-width: 0; }
.lb-sws { display: flex; flex-wrap: wrap; gap: 6px; }
.lb-sw { position: relative; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line2); cursor: pointer; padding: 0; display: inline-grid; place-items: center; }
.lb-sw.on { border-color: var(--fg); box-shadow: 0 0 0 2px var(--surface2), 0 0 0 4px var(--tc); }
.lb-sw.custom { background: conic-gradient(#e0555a, #e8b04a, #7bc46b, #4aa8c8, #8a6bd0, #e0555a); color: #fff; overflow: hidden; }
.lb-sw.custom .lb-color { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; padding: 0; border: 0; }
.lb-shelfsel select { width: auto; min-width: 180px; }
.ar-list { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; }
@media (max-width: 560px) {
  :root { --lh: 190px; }
  .lb-frame { padding: 8px 8px 8px; }
  .lb-row { padding: 0 4px; }
  .lb-top { flex-direction: column; align-items: stretch; }
  .lb-prev { align-self: flex-start; }
  .lb-opt .lbl { flex-basis: 100%; }
}
.lite .lb-bk { transition: none; }
@media (prefers-reduced-motion: reduce) { .lb-bk { transition: none; } .lb-sp.flash .lb-bk { animation: none; } }


/* ===== Díszek (v2): méretek + egyéni animációk. Csak transform/opacity, egyszeri lejátszás (nincs végtelen animáció). ===== */
.lb-slot.deco { --w: calc(var(--k) * (var(--lh) - 40px) * var(--ar)); }
.lb-deco { overflow: visible; }
.lb-deco:focus-visible { outline: 2px solid var(--tc); outline-offset: 3px; border-radius: 8px; }
.dc-art { display: block; width: 100%; height: 100%; pointer-events: none; }
.dc-svg { display: block; width: 100%; height: 100%; overflow: visible; }
.dc-svg .d-nose, .dc-svg .d-bookhit, .dc-svg .d-hit { pointer-events: all; cursor: pointer; }
.lb.edit .dc-svg .d-nose, .lb.edit .dc-svg .d-bookhit, .lb.edit .dc-svg .d-hit { cursor: grab; }
.lb-deco g, .lb-deco path, .lb-deco circle, .lb-deco ellipse { transform-box: view-box; }
.lb-deco .d-smoke circle, .lb-deco .d-sparks circle, .lb-deco .d-hearts path { transform-box: fill-box; transform-origin: center; }


/* --- fekvő sárkány (2D tartalék): nyugalmi állapot + játékok (pislogás, bökés, düh, simogatás) --- */
.dl-svg .d-head { transform-origin: 70px 56px; }
.dl-svg .d-jaw { transform-origin: 64px 58px; }
.dl-svg .d-brow { transform-origin: 53px 31px; }
.dl-svg .d-lid { transform: translateY(-20px); }
.dl-svg .d-look { transform: translate(var(--ex, 0px), var(--ey, 0px)); transition: transform .16s ease-out; }
.dl-svg .d-wing { transform-origin: 104px 40px; }
.dl-svg .d-smoke circle { fill: rgba(222, 226, 236, .85); opacity: 0; }
.dl-svg .d-sparks circle { fill: #ffb347; opacity: 0; }
.dl-svg .d-hearts path { fill: #ff7d96; opacity: 0; }
.dl-svg .sm1 { --dx: -12px; --dy: -14px; } .dl-svg .sm2 { --dx: -20px; --dy: -6px; } .dl-svg .sm3 { --dx: -7px; --dy: -22px; }
.dl-svg .sp1 { --dx: -26px; --dy: -8px; } .dl-svg .sp2 { --dx: -34px; --dy: 2px; } .dl-svg .sp3 { --dx: -20px; --dy: -16px; }
.is-blink .dl-svg .d-lid { animation: dlBlink .26s ease-in-out; }
.is-boop .dl-svg .d-head { animation: dlRecoil 1.2s ease-out; }
.is-boop .dl-svg .d-brow { animation: dlFrown 2.1s ease-in-out; }
.is-boop .dl-svg .d-lid { animation: dlLidAngry 2.1s ease-in-out; }
.is-boop .dl-svg .d-glow { animation: dlGlow 2.1s ease-in-out; }
.is-boop .dl-svg .d-smoke .sm1 { animation: dlPuff .95s .1s ease-out; }
.is-boop .dl-svg .d-smoke .sm2 { animation: dlPuff 1.1s .32s ease-out; }
.is-boop .dl-svg .d-smoke .sm3 { animation: dlPuff 1.2s .55s ease-out; }
.is-rage .dl-svg .d-head { animation: dlShake .95s ease-in-out; }
.is-rage .dl-svg .d-jaw { animation: dlJaw 2.6s ease-in-out; }
.is-rage .dl-svg .d-brow { animation: dlFrown 2.6s ease-in-out; }
.is-rage .dl-svg .d-lid { animation: dlLidAngry 2.6s ease-in-out; }
.is-rage .dl-svg .d-glow { animation: dlGlow 2.6s ease-in-out; }
.is-rage .dl-svg .d-wing { animation: dlWing 2.6s ease-in-out; }
.is-rage .dl-svg .d-smoke circle { animation: dlPuff 1.3s .1s ease-out; }
.is-rage .dl-svg .d-sparks .sp1 { animation: dlSpark 1s .12s ease-out; } .is-rage .dl-svg .d-sparks .sp2 { animation: dlSpark 1.1s .26s ease-out; } .is-rage .dl-svg .d-sparks .sp3 { animation: dlSpark .95s .4s ease-out; }
.is-pet .dl-svg .d-head { animation: dlNuzzle 2.6s ease-in-out; }
.is-pet .dl-svg .d-lid { animation: dlLidPet 2.6s ease-in-out; }
.is-pet .dl-svg .d-hearts .h1 { animation: dlHeart 1.9s .15s ease-out; }
.is-pet .dl-svg .d-hearts .h2 { animation: dlHeart 1.9s .65s ease-out; }
@keyframes dlBlink { 50% { transform: translateY(0); } }
@keyframes dlRecoil { 0% { transform: none; } 10% { transform: translate(-4px, 1px) rotate(-1.6deg); } 32% { transform: translate(-1px, 0) rotate(-.4deg); } 100% { transform: none; } }
@keyframes dlFrown { 0%, 100% { transform: none; } 12%, 76% { transform: translateY(2px) rotate(8deg) scaleY(1.15); } }
@keyframes dlLidAngry { 0%, 100% { transform: translateY(-20px); } 12%, 76% { transform: translateY(-3px) rotate(14deg); } }
@keyframes dlGlow { 0%, 100% { opacity: 0; } 20%, 70% { opacity: .6; } }
@keyframes dlShake { 0%, 100% { transform: none; } 10% { transform: translate(-4px, 1px) rotate(-3deg); } 24% { transform: translate(2px, 0) rotate(2deg); } 38% { transform: translate(-3px, 1px) rotate(-2.5deg); } 52% { transform: translate(1.5px, 0) rotate(1.2deg); } 70% { transform: translate(-.5px, 0); } }
@keyframes dlJaw { 0%, 100% { transform: none; } 10%, 74% { transform: rotate(-16deg); } }
@keyframes dlWing { 0%, 100% { transform: none; } 14%, 70% { transform: translateY(-6px) rotate(-8deg) scale(1.1); } }
@keyframes dlPuff { 0% { opacity: 0; transform: translate(0, 0) scale(.4); } 16% { opacity: .9; } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(3.4); } }
@keyframes dlSpark { 0% { opacity: 0; transform: translate(0, 0) scale(1); } 12% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.3); } }
@keyframes dlNuzzle { 0%, 100% { transform: none; } 20%, 78% { transform: translate(1px, 2px) rotate(2.4deg); } }
@keyframes dlLidPet { 0%, 100% { transform: translateY(-20px); } 24%, 76% { transform: translateY(0); } }
@keyframes dlHeart { 0% { opacity: 0; transform: translateY(8px) scale(.4); } 20% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-22px) scale(1.15); } }

/* --- díszek ablaka --- */
.dc-list { display: flex; flex-direction: column; gap: 12px; }
.dc-card { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 16px; align-items: center; }
.dc-prev { display: flex; gap: 0; align-items: flex-end; padding: 10px 14px 8px; border-radius: 12px; background: #2f1e15; border-bottom: 8px solid #84522d; }
.dc-prev-i { display: block; width: calc(96px * var(--ar)); height: 96px; }
.dc-info { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.dc-info h3 { font-family: var(--f-ui); font-weight: 700; font-size: 1.05rem; }
.dc-tip { display: flex; align-items: center; gap: 6px; color: var(--tc); font-weight: 600; }
.dc-shelfsel select { width: auto; min-width: 180px; }
@media (max-width: 560px) { .dc-card { grid-template-columns: 1fr; justify-items: start; } }


/* ===== Díszek 2: olvasó szellem, lámpás, üvegablak-panelek ===== */
/* --- olvasó szellem --- */
.gh-svg .d-gbody { transform-origin: 60px 124px; }
.gh-svg .d-halo { opacity: .55; transform-origin: 60px 62px; }
.gh-svg .d-rays, .gh-svg .d-excl, .gh-svg .d-pg, .gh-svg .d-oh { opacity: 0; }
.gh-svg .d-rays { transform-origin: 60px 52px; }
.gh-svg .d-lid { transform-box: fill-box; transform-origin: 50% 0; transform: scaleY(0); }
.gh-svg .d-eyes, .gh-svg .d-oh { transform-box: fill-box; transform-origin: center; }
.gh-svg .d-look { transform: translate(var(--ex, 0px), var(--ey, 0px)); transition: transform .16s ease-out; }
.gh-svg .d-arml { transform-origin: 25px 68px; }
.gh-svg .d-armr { transform-origin: 95px 68px; }
.gh-svg .d-bookg { transform-origin: 60px 110px; }
.gh-svg .d-pg { transform-origin: 60px 90px; }
.gh-svg .d-excl { transform-origin: 60px -2px; }
.is-blink .gh-svg .d-lid { animation: ghBlink .3s ease-in-out; }
@keyframes ghBlink { 0%, 100% { transform: scaleY(0); } 45%, 60% { transform: scaleY(1); } }

/* megijed */
.is-startle .d-gbody { animation: ghStartle 1.8s ease-out; }
.is-startle .d-arml { animation: ghArmL 1.8s ease-in-out; }
.is-startle .d-armr { animation: ghArmR 1.8s ease-in-out; }
.is-startle .d-bookg { animation: ghBookFly 1.8s ease-in-out; }
.is-startle .d-eyes { animation: ghWide 1.8s ease-in-out; }
.is-startle .d-smile { animation: ghSmileOff 1.8s steps(1, end); }
.is-startle .d-oh { animation: ghOh 1.8s steps(1, end); }
.is-startle .d-excl { animation: ghExcl 1.8s ease-out; }
.is-startle .d-halo { animation: ghHalo 1.8s ease-in-out; }
@keyframes ghStartle { 0% { transform: none; } 6% { transform: scale(1.05, .9); } 18% { transform: translateY(-17px) scale(.94, 1.1); } 36% { transform: translateY(0) scale(1.07, .9); } 48% { transform: scale(.98, 1.04); } 60%, 100% { transform: none; } }
@keyframes ghArmL { 0%, 100% { transform: none; } 10%, 62% { transform: rotate(140deg); } }
@keyframes ghArmR { 0%, 100% { transform: none; } 10%, 62% { transform: rotate(-140deg); } }
@keyframes ghBookFly { 0%, 100% { transform: none; } 14% { transform: translateY(-22px) rotate(-16deg); } 40% { transform: translateY(3px) rotate(3deg); } 52% { transform: none; } }
@keyframes ghWide { 0%, 100% { transform: none; } 10%, 66% { transform: scale(1.28); } }
@keyframes ghSmileOff { 0%, 100% { opacity: 1; } 6% { opacity: 0; } 66% { opacity: 1; } }
@keyframes ghOh { 0%, 100% { opacity: 0; } 6% { opacity: 1; } 66% { opacity: 0; } }
@keyframes ghExcl { 0% { opacity: 0; transform: scale(.2); } 12% { opacity: 1; transform: scale(1.25); } 20%, 64% { opacity: 1; transform: scale(1); } 80%, 100% { opacity: 0; transform: scale(1); } }
@keyframes ghHalo { 0%, 100% { opacity: .55; } 16%, 60% { opacity: 1; } }

/* kezével eltakarja a szemét, kikukucskál */
.is-hide .d-gbody { animation: ghTremble 2.8s ease-in-out; }
.is-hide .d-arml { animation: ghHideL 2.8s ease-in-out; }
.is-hide .d-armr { animation: ghHideR 2.8s ease-in-out; }
.is-hide .d-bookg { animation: ghBookDrop 2.8s ease-in-out; }
.is-hide .d-smile { animation: ghSmileOff 2.8s steps(1, end); }
.is-hide .d-oh { animation: ghOhHide 2.8s steps(1, end); }
@keyframes ghTremble { 0%, 100% { transform: none; } 12% { transform: translateX(-1.4px) rotate(-.8deg); } 18% { transform: translateX(1.4px) rotate(.8deg); } 24% { transform: translateX(-1.2px) rotate(-.7deg); } 30% { transform: translateX(1.2px) rotate(.7deg); } 36% { transform: translateX(-1px) rotate(-.5deg); } 42% { transform: translateX(.8px); } 50% { transform: none; } }
@keyframes ghHideL { 0%, 100% { transform: none; } 14%, 76% { transform: rotate(-107deg); } }
@keyframes ghHideR { 0%, 100% { transform: none; } 14%, 46% { transform: rotate(107deg); } 56%, 70% { transform: rotate(84deg); } 80% { transform: rotate(107deg); } 88% { transform: none; } }
@keyframes ghBookDrop { 0%, 100% { transform: none; } 14%, 76% { transform: translateY(8px) rotate(5deg); } 90% { transform: none; } }
@keyframes ghOhHide { 0%, 100% { opacity: 0; } 10%, 48% { opacity: 1; } 56% { opacity: 0; } }

/* Búúú! */
.is-spook .d-gbody { animation: ghSpook 2.7s ease-in-out; }

.nkz { position: fixed; inset: 0; z-index: 96; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }

</style>

<div id="bg" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
<div id="app">
  <header id="top"></header>
  <main id="view" tabindex="-1"></main>
  <nav id="tabs" aria-label="Fő navigáció"></nav>
</div>
<div id="toasts" aria-live="polite"></div>

<script>
/* ===== Engine: DSL + koherens sorsoló motor (v2: kényszer-megoldó) =====
   Szürreális mód KI: az eredmény mindig koherens (0 szabálysértés), ha létezik ilyen kombináció.
   Szürreális mód BE: a ~ opciók és a káosz-kockák szabályt szeghetnek (lila jelzés).
   DSL: "Szöveg #cimke !utkozik ?kell|vagy +szivesen *suly ~"                                    */
const Engine = (() => {
  'use strict';

  const slug = s => String(s == null ? '' : s).toLowerCase().normalize('NFD')
    .replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');

  let _n = 0;
  const uid = () => 'i' + Date.now().toString(36).slice(-4) + (++_n).toString(36) + Math.random().toString(36).slice(2, 6);
  const uniq = a => Array.from(new Set(a));
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

  /* ---------- címke-szótár: az azonosító ékezet nélküli (slug), a megjelenített név ékezetes ---------- */
  const tagNames = {};
  function tag(raw) {
    const r = String(raw == null ? '' : raw).trim(), s = slug(r);
    if (s && r !== s && /[^\u0000-\u007f]/.test(r)) tagNames[s] = r.toLowerCase();
    return s;
  }
  const tagLabel = s => tagNames[s] || s;
  function setTagNames(o) {
    if (o && typeof o === 'object') Object.keys(o).forEach(k => { if (typeof o[k] === 'string' && o[k].length < 40) tagNames[k] = o[k]; });
  }

  /* ---------- DSL ---------- */
  function parseLine(line) {
    const o = { id: uid(), t: '', g: [], x: [], n: [], w: [], s: false, p: 1 };
    const words = [];
    String(line).trim().split(/\s+/).forEach(tok => {
      if (!tok) return;
      const c = tok[0], rest = tok.slice(1);
      if (c === '~' && !rest) { o.s = true; return; }
      if (c === '*' && /^\d+([.,]\d+)?$/.test(rest)) { o.p = clamp(parseFloat(rest.replace(',', '.')), 0.1, 50); return; }
      if (rest && '#!?+'.indexOf(c) >= 0) {
        if (c === '?') {
          const grp = uniq(rest.split('|').map(tag).filter(Boolean));
          if (grp.length) o.n.push(grp);
        } else {
          const t = tag(rest);
          if (!t) return;
          (c === '#' ? o.g : c === '!' ? o.x : o.w).push(t);
        }
        return;
      }
      words.push(tok);
    });
    o.t = words.join(' ');
    o.g = uniq(o.g); o.x = uniq(o.x); o.w = uniq(o.w);
    return o;
  }

  const lbls = a => a.map(tagLabel);
  function fmtLine(o) {
    return [o.t]
      .concat(lbls(o.g).map(t => '#' + t), lbls(o.x).map(t => '!' + t), o.n.map(g => '?' + lbls(g).join('|')), lbls(o.w).map(t => '+' + t),
        o.p && o.p !== 1 ? ['*' + o.p] : [], o.s ? ['~'] : [])
      .filter(Boolean).join(' ');
  }

  function parseLines(text) {
    return String(text).split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(parseLine).filter(o => o.t);
  }

  /* ---------- segédek ---------- */
  const splitList = s => String(s || '').split(/[,;\/|]+/).map(x => x.trim()).filter(Boolean);
  const hasAny = (arr, set) => { for (let i = 0; i < arr.length; i++) if (set.has(arr[i])) return true; return false; };
  const inter = (a, b) => { for (let i = 0; i < a.length; i++) if (b.indexOf(a[i]) >= 0) return true; return false; };

  function shuffle(arr, R) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  function wchoose(items, weights, R) {
    let tot = 0; for (let i = 0; i < weights.length; i++) tot += weights[i];
    let r = R() * tot;
    for (let i = 0; i < items.length; i++) { r -= weights[i]; if (r <= 0) return items[i]; }
    return items[items.length - 1];
  }

  const allowed = (die, ctx) => (die.options || []).filter(o => o.t && (ctx.surreal || !o.s));
  const pw = o => o.p > 0 ? o.p : 1;
  const conflict = (a, b) => inter(a.x, b.g) || inter(b.x, a.g);

  /* címke-szolgáltatók: melyik kocka milyen címkéket adhat (az engedélyezett opciókból) */
  function providers(dice, ctx) {
    const prov = {};
    dice.forEach(d => {
      if (d.kind === 'shelf') return;
      const s = new Set();
      allowed(d, ctx).forEach(o => o.g.forEach(t => s.add(t)));
      prov[d.id] = s;
    });
    return prov;
  }

  const satisfiable = (grp, ownId, dice, prov) =>
    dice.some(d => d.id !== ownId && prov[d.id] && grp.some(t => prov[d.id].has(t)));

  function unmetGroups(opt, ownId, picks, dice, prov) {
    const out = [];
    opt.n.forEach(grp => {
      if (!satisfiable(grp, ownId, dice, prov)) return;       // senki nem tud ilyet adni → nem büntetjük
      let ok = false;
      for (const id in picks) {
        if (id === ownId) continue;
        const po = picks[id] && picks[id].opt;
        if (po && inter(po.g, grp)) { ok = true; break; }
      }
      if (!ok) out.push(grp);
    });
    return out;
  }

  /* ---------- ellenőrzés ---------- */
  function violations(dice, picks, prov) {
    const conflicts = [], unmet = [];
    const ids = dice.map(d => d.id).filter(id => picks[id] && picks[id].opt);
    for (let i = 0; i < ids.length; i++) {
      const a = picks[ids[i]].opt;
      for (let j = i + 1; j < ids.length; j++) {
        const b = picks[ids[j]].opt;
        if (conflict(a, b)) conflicts.push([ids[i], ids[j]]);
      }
      unmetGroups(a, ids[i], picks, dice, prov).forEach(grp => unmet.push({ die: ids[i], group: grp }));
    }
    return { count: conflicts.length + unmet.length, conflicts, unmet };
  }

  function annotate(dice, picks, ctx) {
    const prov = providers(dice, ctx);
    const v = violations(dice, picks, prov);
    const bad = new Set();
    v.conflicts.forEach(c => { bad.add(c[0]); bad.add(c[1]); });
    v.unmet.forEach(u => bad.add(u.die));
    for (const id in picks) {
      const p = picks[id]; if (!p || !p.opt) continue;
      p.flag = p.opt.s ? 's' : (bad.has(id) ? (p.chaos && ctx.surreal ? 's' : 'c') : '');
    }
    return v;
  }

  const chaosOf = ctx => ctx.chaos == null ? 0.35 : ctx.chaos;
  const sw = ctx => 0.5 + 1.8 * chaosOf(ctx);

  /* ---------- súlyozás ---------- */
  function prefWeight(o, die, others, dice, prov, ctx) {
    const have = new Set(), want = new Set(), unmet = new Set();
    for (const id in others) {
      const po = others[id] && others[id].opt;
      if (!po || id === die.id) continue;
      po.g.forEach(t => have.add(t));
      po.w.forEach(t => want.add(t));
      unmetGroups(po, id, others, dice, prov).forEach(g => g.forEach(t => unmet.add(t)));
    }
    let w = ((ctx.surreal && o.s) ? sw(ctx) : 1) * pw(o);
    if (hasAny(o.g, want)) w *= 3;
    if (hasAny(o.w, have)) w *= 3;
    if (hasAny(o.g, unmet)) w *= 4;
    const ng = o.n.filter(grp => satisfiable(grp, die.id, dice, prov));
    if (ng.length) w *= ng.every(grp => hasAny(grp, have)) ? 2 : 0.35;
    return w;
  }

  /* ---------- könyvespolc ---------- */
  const bookOpt = b => ({
    id: 'book:' + b.id,
    t: b.title + (b.author ? ' – ' + b.author : ''),
    g: uniq(splitList(b.genre).map(slug).concat(splitList(b.mood).map(slug))),
    x: [], n: [], w: [], s: false, p: 1, book: b
  });

  const noBookOpt = () => ({ id: 'book:none', t: 'A polc üres – vegyél fel könyveket', g: [], x: [], n: [], w: [], s: false, p: 1, book: null });

  function bookFilters(dice, picks) {
    const f = {};
    dice.forEach(d => {
      if (!d.role || d.kind === 'shelf' || !picks[d.id] || !picks[d.id].opt) return;
      const o = picks[d.id].opt;
      f[d.role] = new Set(o.g.concat([slug(o.t)]));
    });
    return f;
  }

  function bookMatches(b, f, skip) {
    if (f.genre && skip.indexOf('genre') < 0 && !f.genre.has('barmi')) {
      const gs = splitList(b.genre).map(slug);
      if (gs.length && !gs.some(g => f.genre.has(g))) return false;
    }
    if (f.mood && skip.indexOf('mood') < 0) {
      const ms = splitList(b.mood).map(slug);
      if (ms.length && !ms.some(m => f.mood.has(m))) return false;
    }
    if (f.length && skip.indexOf('length') < 0) {
      const p = +b.pages;
      if (p > 0) { const k = p < 250 ? 'rovid' : p < 500 ? 'kozepes' : 'hosszu'; if (!f.length.has(k)) return false; }
    }
    return true;
  }

  function pickBook(dice, picks, ctx, R, excludeId) {
    let books = (ctx.books || []).filter(b => b.title);
    if (ctx.onlyUnread) books = books.filter(b => b.status !== 'elolvastam');
    if (!books.length) return { opt: noBookOpt(), relaxed: [] };
    const f = bookFilters(dice, picks);
    const drops = [];
    let pool = books.filter(b => bookMatches(b, f, drops));
    for (const key of ['length', 'mood', 'genre']) {
      if (pool.length) break;
      drops.push(key);
      pool = books.filter(b => bookMatches(b, f, drops));
    }
    if (!pool.length) pool = books;
    if (excludeId && pool.length > 1) pool = pool.filter(b => b.id !== excludeId);
    const b = pool[Math.floor(R() * pool.length)];
    return { opt: bookOpt(b), relaxed: drops };
  }

  /* ---------- kényszer-megoldó (visszalépéses, súlyozott véletlennel) ----------
     base: rögzített választások (zároltak, káosz-kockák); rest: a kiosztandó kockák.
     ignore: azok a rögzítettek, amelyeknek a szabályait nem kényszerítjük (káosz-kockák).
     Siker: minden kiosztott opció ütközésmentes, és minden teljesíthető „kell" feltétel teljesül. */
  function orderDice(rest, ctx, R) {
    const share = d => { const a = allowed(d, ctx); return a.length ? a.filter(o => o.n.length).length / a.length : 0; };
    return shuffle(rest, R).map(d => ({ d, k: share(d) })).sort((a, b) => a.k - b.k).map(x => x.d);
  }

  function solve(normal, rest, base, ctx, prov, R, o) {
    o = o || {};
    const ignore = o.ignore || new Set(), keep = o.keep || null;
    const picks = Object.assign({}, base);
    const order = orderDice(rest, ctx, R);
    const budget = { n: o.budget || 2500 };
    const doms = {}; rest.forEach(d => { doms[d.id] = allowed(d, ctx); });

    // egy kiosztott opció „kell" csoportjai: teljesülnek vagy még teljesülhetnek a hátralévő kockákból
    const needsOK = (opt, ownId, remIds) => {
      for (let gi = 0; gi < opt.n.length; gi++) {
        const grp = opt.n[gi];
        if (!satisfiable(grp, ownId, normal, prov)) continue;
        let ok = false;
        for (const id in picks) { if (id !== ownId && picks[id] && picks[id].opt && inter(picks[id].opt.g, grp)) { ok = true; break; } }
        if (!ok) for (let r = 0; r < remIds.length && !ok; r++) if (remIds[r] !== ownId && prov[remIds[r]] && grp.some(t => prov[remIds[r]].has(t))) ok = true;
        if (!ok) return false;
      }
      return true;
    };
    const feasible = remIds => {
      for (const id in picks) {
        if (ignore.has(id) || !picks[id] || !picks[id].opt) continue;
        if (!needsOK(picks[id].opt, id, remIds)) return false;
      }
      return true;
    };

    function rec(i) {
      if (i >= order.length) return true;
      const die = order[i], remIds = order.slice(i + 1).map(d => d.id);
      let cands = doms[die.id].filter(opt => {
        for (const id in picks) { const po = picks[id] && picks[id].opt; if (po && conflict(opt, po)) return false; }
        return needsOK(opt, die.id, remIds);
      });
      let ws = cands.map(opt => {
        let w = prefWeight(opt, die, picks, normal, prov, ctx);
        if (keep && keep[die.id] && keep[die.id].opt && keep[die.id].opt.id === opt.id) w *= 8;
        return w;
      });
      while (cands.length) {
        if (--budget.n < 0) return false;
        const k = cands.length === 1 ? 0 : (() => { const c = wchoose(cands.map((_, x) => x), ws, R); return c; })();
        const opt = cands[k]; cands.splice(k, 1); ws.splice(k, 1);
        picks[die.id] = { opt };
        if (feasible(remIds) && rec(i + 1)) return true;
        delete picks[die.id];
      }
      return false;
    }
    if (!rec(0)) return null;
    // a rögzítetteket (zárolt) is érvényesítjük: ha azok nem teljesülnek, nincs „tiszta" megoldás
    const v = violations(normal, picks, prov);
    const strict = v.conflicts.filter(c => !(ignore.has(c[0]) && ignore.has(c[1])) && !(base[c[0]] && base[c[1]]));
    const un = v.unmet.filter(u => !ignore.has(u.die));
    if (strict.length || un.length) return null;
    return picks;
  }

  /* ---------- sorsolás ---------- */
  const rngOf = ctx => ctx.rng || Math.random;

  // a régi, szabálysértést minimalizáló keresés: tartalék, ha zárolások miatt nincs tiszta megoldás
  function chooseOpt(die, dice, picks, ctx, prov, R) {
    const cands = allowed(die, ctx);
    if (!cands.length) return null;
    const scored = cands.map(o => {
      let conf = 0;
      for (const id in picks) { const po = picks[id] && picks[id].opt; if (po && id !== die.id && conflict(o, po)) conf++; }
      return { o, conf };
    });
    const min = Math.min.apply(null, scored.map(s => s.conf));
    const pool = scored.filter(s => s.conf === min).map(s => s.o);
    return wchoose(pool, pool.map(o => prefWeight(o, die, picks, dice, prov, ctx)), R);
  }

  function rollAll(dice, cur, locks, ctx) {
    const R = rngOf(ctx);
    const prov = providers(dice, ctx);
    const normal = dice.filter(d => d.kind !== 'shelf');
    const shelf = dice.filter(d => d.kind === 'shelf');
    const base = {};
    dice.forEach(d => { if (locks[d.id] && cur[d.id]) base[d.id] = { opt: cur[d.id].opt, relaxed: cur[d.id].relaxed }; });
    const ignore = new Set();

    if (ctx.surreal) {                       // káosz: néhány kocka figyelmen kívül hagyja a szabályokat
      const pc = chaosOf(ctx) * 0.5;
      normal.forEach(d => {
        if (base[d.id] || R() >= pc) return;
        const c = allowed(d, ctx);
        if (!c.length) return;
        base[d.id] = { opt: wchoose(c, c.map(o => (o.s ? sw(ctx) : 1) * pw(o)), R), chaos: true };
        ignore.add(d.id);
      });
    }

    const rest = normal.filter(d => !base[d.id]);
    const run = () => {
      let b = rest.length ? solve(normal, rest, base, ctx, prov, R, { ignore }) : Object.assign({}, base);
      if (!b) {                              // nincs tiszta megoldás (pl. egymásnak ellentmondó zárak) → legkevesebb szabálysértés
        let bs = Infinity;
        for (let a = 0; a < 200; a++) {
          const picks = Object.assign({}, base);
          shuffle(rest, R).forEach(d => { const o = chooseOpt(d, dice, picks, ctx, prov, R); if (o) picks[d.id] = { opt: o }; });
          const sc = violations(normal, picks, prov).count;
          if (sc < bs) { bs = sc; b = picks; if (sc === 0) break; }
        }
      }
      b = b || Object.assign({}, base);
      shelf.forEach(d => {
        if (base[d.id]) { b[d.id] = base[d.id]; return; }
        const prev = cur[d.id] && cur[d.id].opt && cur[d.id].opt.book ? cur[d.id].opt.book.id : null;
        b[d.id] = pickBook(dice, b, ctx, R, prev);
      });
      return b;
    };
    // ha a polcon nincs a szűrőkhöz illő könyv, újrapróbáljuk más műfaj/hangulat/hossz kombinációval
    const relaxN = b => shelf.reduce((n, d) => n + (b[d.id] && b[d.id].relaxed ? b[d.id].relaxed.length : 0), 0);
    let best = run();
    for (let a = 0; a < 40 && shelf.length && rest.length && relaxN(best) > 0; a++) { const b = run(); if (relaxN(b) < relaxN(best)) best = b; }
    annotate(dice, best, ctx);
    return best;
  }

  /* egy kocka újradobása. Ha a többihez nem illik másik opció, a szomszédos (nem zárolt) kockák is
     átrendeződnek, hogy az eredmény koherens maradjon. A hívó a változott kockákat animálja. */
  function rollOne(dice, dieId, cur, ctx, locks) {
    locks = locks || {};
    const R = rngOf(ctx);
    const die = dice.find(d => d.id === dieId);
    if (!die) return cur;
    const next = Object.assign({}, cur);
    const prov = providers(dice, ctx);
    const refreshShelf = () => dice.filter(d => d.kind === 'shelf').forEach(s => {
      if (die.role && !locks[s.id]) next[s.id] = pickBook(dice, next, ctx, R, null);
    });
    if (die.kind === 'shelf') {
      const prev = cur[dieId] && cur[dieId].opt && cur[dieId].opt.book ? cur[dieId].opt.book.id : null;
      next[dieId] = pickBook(dice, cur, ctx, R, prev);
      annotate(dice, next, ctx);
      return next;
    }
    const normal = dice.filter(d => d.kind !== 'shelf');
    const others = Object.assign({}, cur); delete others[dieId];
    const curId = cur[dieId] && cur[dieId].opt ? cur[dieId].opt.id : null;
    let cands = allowed(die, ctx);
    if (!cands.length) return next;
    if (curId && cands.length > 1) cands = cands.filter(o => o.id !== curId);

    let chosen = null, chaos = false;
    if (ctx.surreal && R() < chaosOf(ctx) * 0.5) {
      chosen = wchoose(cands, cands.map(o => (o.s ? sw(ctx) : 1) * pw(o)), R); chaos = true;
    } else {
      const scored = cands.map(o => {
        const p = Object.assign({}, others); p[dieId] = { opt: o };
        return { o, v: violations(normal, p, prov).count };
      });
      const clean = scored.filter(s => s.v === 0).map(s => s.o);
      if (clean.length) {
        let pool = clean;
        if (die.role && dice.some(d => d.kind === 'shelf')) {   // csak olyan opció, amihez van illő könyv a polcon
          const good = clean.filter(o => { const p = Object.assign({}, others); p[dieId] = { opt: o }; return pickBook(dice, p, ctx, R, null).relaxed.length === 0; });
          if (good.length) pool = good;
        }
        chosen = wchoose(pool, pool.map(o => prefWeight(o, die, others, dice, prov, ctx)), R);
      } else {
        // kaszkád: az új opcióhoz igazítjuk a nem zárolt szomszédokat (a mostaniakat előnyben tartva)
        const free = normal.filter(d => d.id !== dieId && !locks[d.id]);
        const fixed = {}; normal.forEach(d => { if (d.id !== dieId && locks[d.id] && cur[d.id]) fixed[d.id] = cur[d.id]; });
        let order = cands.slice(), ws = order.map(o => prefWeight(o, die, others, dice, prov, ctx));
        for (let tries = 0; tries < 14 && order.length && !chosen; tries++) {
          const k = wchoose(order.map((_, x) => x), ws, R);
          const o = order[k]; order.splice(k, 1); ws.splice(k, 1);
          const base = Object.assign({}, fixed); base[dieId] = { opt: o };
          const sol = solve(normal, free, base, ctx, prov, R, { keep: cur, budget: 1200 });
          if (sol) { chosen = o; normal.forEach(d => { if (sol[d.id]) next[d.id] = { opt: sol[d.id].opt }; }); }
        }
        if (!chosen) {                       // tartalék: a legkevesebb szabálysértésű opció, jelzéssel
          const min = Math.min.apply(null, scored.map(s => s.v));
          const pool = scored.filter(s => s.v === min).map(s => s.o);
          chosen = wchoose(pool, pool.map(o => prefWeight(o, die, others, dice, prov, ctx)), R);
        }
      }
    }
    next[dieId] = { opt: chosen, chaos: chaos };
    refreshShelf();
    annotate(dice, next, ctx);
    return next;
  }

  /* kézzel választott opció állapota a többihez képest */
  function fits(dice, picks, dieId, opt, ctx) {
    const prov = providers(dice, ctx);
    const p = Object.assign({}, picks); p[dieId] = { opt };
    const normal = dice.filter(d => d.kind !== 'shelf');
    const base = Object.assign({}, picks); delete base[dieId];
    return violations(normal, p, prov).count <= violations(normal, base, prov).count;
  }

  /* kikeresi, mely opciók „halottak": soha nem szerepelhetnek koherens eredményben (pontos: opciónként megoldást keres) */
  function deadOptions(dice, ctx) {
    const R = rngOf(ctx), c = Object.assign({}, ctx, { surreal: false });
    const normal = dice.filter(d => d.kind !== 'shelf'), prov = providers(normal, c), dead = [];
    normal.forEach(d => allowed(d, c).forEach(o => {
      const base = {}; base[d.id] = { opt: o };
      const rest = normal.filter(x => x.id !== d.id);
      if (!solve(normal, rest, base, c, prov, R, { budget: 4000 })) dead.push({ die: d.id, opt: o });
    }));
    return dead;
  }

/* ===== Seed alap: segédek, példa könyvek, migráció. A témák a src/data-*.js fájlokban vannak (SeedParts) ===== */
const SeedParts = {};   // témánként: SeedParts.<id> = T => T.theme(...)
const Seed = (() => {
  const VERSION = 2;
  const ORDER = ['randi', 'utazas', 'kaja', 'fozes', 'mozi', 'kezmuves', 'konyv', 'meghitt'];
  const NEW_IN_V2 = ['fozes'];
  // a v1 alap témák aláírásai: ha a tárolt téma még pontosan ilyen, csendben lecserélhető az újra
  const LEGACY = { randi: 'izqoye', utazas: '906rc2', kaja: '1xbpg2i', mozi: 'iqn7zj', kezmuves: '1mfhgqk', konyv: '12xfzm2', meghitt: '1kwsxje' };
  const hash = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); };
  const sig = t => hash(JSON.stringify(t.dice.map(d => [d.name, d.kind || '', (d.options || []).map(o => o.t)])));

  const die = (id, name, icon, lines, extra) =>
    Object.assign({ id, name, icon, enabled: true, role: null, options: Engine.parseLines(lines) }, extra || {});
  const theme = (id, name, emoji, color, desc, dice) => ({ id, name, emoji, color, desc, builtin: true, dice });
  const T = { die, theme };

  /* ---------- Könyvek ---------- */
  const BOOK_GENRES = ['Krimi', 'Thriller', 'Fantasy', 'Sci-fi', 'Regény', 'Romantikus', 'Történelmi regény', 'Ifjúsági', 'Horror', 'Humor', 'Ismeretterjesztő', 'Mese', 'Disztópia'];
  const BOOK_MOODS = ['megnyugtató', 'izgalmas', 'megható', 'vicces', 'elgondolkodtató', 'sötét', 'kalandos'];

  // [cím, szerző, műfaj, hangulat, oldal, állapot]
  const BOOKS = [
    ['A kis herceg', 'Antoine de Saint-Exupéry', 'Mese', 'megható', 96, 'olvasatlan'],
    ['Micimackó', 'A. A. Milne', 'Mese', 'megnyugtató', 160, 'olvasatlan'],

    ['1984', 'George Orwell', 'Disztópia', 'sötét', 330, 'olvasatlan'],
    ['Büszkeség és balítélet', 'Jane Austen', 'Romantikus', 'megnyugtató', 400, 'olvasatlan'],
    ['Egy Ove nevű férfi', 'Fredrik Backman', 'Regény', 'megható', 330, 'olvasatlan'],
    ['Az alkimista', 'Paulo Coelho', 'Regény', 'elgondolkodtató', 190, 'olvasatlan'],
    ['Ragyogás', 'Stephen King', 'Horror', 'sötét', 520, 'olvasatlan'],
    ['Sapiens: Az emberiség rövid története', 'Yuval Noah Harari', 'Ismeretterjesztő', 'elgondolkodtató', 520, 'olvasatlan'],
    ['Kafka a tengerparton', 'Murakami Haruki', 'Regény', 'elgondolkodtató', 500, 'olvasatlan'],
    ['Mágia színe', 'Terry Pratchett', 'Fantasy', 'vicces', 280, 'olvasatlan']
  ];
  const books = () => BOOKS.map(b => ({
    id: Engine.uid(), title: b[0], author: b[1], genre: b[2], mood: b[3], pages: b[4], status: b[5], note: '', example: true
  }));

  function themes() { return ORDER.filter(id => SeedParts[id]).map(id => SeedParts[id](T)); }

  /* v1 → v2: az érintetlen alap témák cseréje az újakra, az átírtak megtartása, új témák hozzáadása */
  function migrate(S) {
    if ((S.seedV || 1) >= VERSION) return null;
    const fresh = themes(), replaced = [], kept = [];
    S.themes = S.themes.map(t => {
      const f = t.builtin && fresh.find(x => x.id === t.id);
      if (!f) return t;
      if (sig(t) === LEGACY[t.id]) { replaced.push(t.name); return f; }
      kept.push(t.name); return t;
    });
    NEW_IN_V2.forEach(id => {
      if (S.themes.some(t => t.id === id)) return;
      const f = fresh.find(x => x.id === id); if (!f) return;
      const prev = S.themes.findIndex(t => t.id === ORDER[ORDER.indexOf(id) - 1]);
      S.themes.splice(prev >= 0 ? prev + 1 : S.themes.length, 0, f);
    });
    S.seedV = VERSION;
    return { replaced, kept };
  }

  return { VERSION, themes, books, BOOK_GENRES, BOOK_MOODS, T, migrate, sig };
})();

  t.dice.forEach(d => {
